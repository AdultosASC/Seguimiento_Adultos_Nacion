<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dirección Nacional de Adultos</title>
  <style>
    :root { --primary: #6366f1; --border: #e2e8f0; }
    body { font-family: sans-serif; background: #f8fafc; padding: 2rem; display: flex; justify-content: center; }
    .container { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
    .hidden { display: none !important; }
    select, button { width: 100%; margin-top: 10px; padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
    button { background: var(--primary); color: white; border: none; cursor: pointer; }
    button:disabled { background: #cbd5e1; }
  </style>
</head>
<body>

<div class="container" id="paginaFiltros">
  <h3>Dirección Nacional de Adultos</h3>
  <label>Área Estratégica</label>
  <select id="selectA" onchange="gestionarCascada('area')"><option value="">Cargando...</option></select>
  
  <div id="grupoC" class="hidden">
    <label>Comisión</label>
    <select id="selectC" onchange="gestionarCascada('comision')"></select>
  </div>

  <div id="grupoN" class="hidden">
    <label>Nombre</label>
    <select id="selectN" onchange="document.getElementById('btnConsultar').disabled = false"></select>
  </div>
  <button id="btnConsultar" disabled onclick="consultar()">Consultar</button>
</div>

<div class="container hidden" id="paginaReporte">
  <h3 id="nombreReporte"></h3>
  <div id="detalleReporte"></div>
  <button onclick="location.reload()">Volver</button>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbw4okkl5_lnmqxK6b2eFL1uG6f92_Fu8BHDun4tvGtrexAECEAdEk1Kf3P9AfL29EH4/exec";
  let datosGlobales = [];

  fetch(API_URL)
    .then(res => res.json())
    .then(data => {
      // Filtramos áreas vacías inmediatamente
      datosGlobales = data;
      const areas = [...new Set(data.map(d => d.area).filter(a => a && a.toString().trim() !== ""))];
      document.getElementById('selectA').innerHTML = '<option value="">Seleccione Área...</option>' + 
        areas.map(a => `<option value="${a}">${a}</option>`).join('');
    });

  function gestionarCascada(nivel) {
    const area = document.getElementById('selectA').value;
    
    if (nivel === 'area') {
      // Filtrar comisiones: solo si existen y no están en blanco
      const comisiones = [...new Set(datosGlobales
        .filter(d => d.area === area && d.comision && d.comision.toString().trim() !== "")
        .map(d => d.comision))];
      
      const grupoC = document.getElementById('grupoC');
      if (comisiones.length > 0) {
        grupoC.classList.remove('hidden');
        document.getElementById('selectC').innerHTML = '<option value="">Seleccione Comisión...</option>' + 
          comisiones.map(c => `<option value="${c}">${c}</option>`).join('');
      } else {
        grupoC.classList.add('hidden');
      }
      document.getElementById('grupoN').classList.remove('hidden');
      filtrarNombres();
    } else {
      filtrarNombres();
    }
  }

  function filtrarNombres() {
    const area = document.getElementById('selectA').value;
    const com = document.getElementById('selectC').value;
    const isComHidden = document.getElementById('grupoC').classList.contains('hidden');
    
    const filtrados = datosGlobales.filter(d => 
      d.area === area && 
      d.nombre && d.nombre.trim() !== "" &&
      (isComHidden || d.comision === com)
    );
    
    document.getElementById('selectN').innerHTML = '<option value="">Seleccione Nombre...</option>' + 
      filtrados.map(d => `<option value="${d.nombre}">${d.nombre}</option>`).join('');
  }

  function consultar() {
    const usuario = datosGlobales.find(d => d.nombre === document.getElementById('selectN').value);
    if (!usuario) return;
    
    document.getElementById('paginaFiltros').classList.add('hidden');
    document.getElementById('paginaReporte').classList.remove('hidden');
    document.getElementById('nombreReporte').innerText = usuario.nombre;
    document.getElementById('detalleReporte').innerHTML = `
      <p><strong>Cargo:</strong> ${usuario.cargo || 'N/A'}</p>
      <p><strong>Comisión:</strong> ${usuario.comision || 'N/A'}</p>
      <p><strong>GN:</strong> ${usuario.gn || 'N/A'}</p>
      <p><strong>AAA:</strong> ${usuario.aaa || 'N/A'}</p>
    `;
  }
</script>
</body>
</html>
