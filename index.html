<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dirección Nacional de Adultos</title>
  <style>
    :root {
      --primary: #6366f1; --primary-hover: #4f46e5; --purple-dark: #4c1d95; --purple-light: #8b5cf6;
      --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --text-light: #64748b; --border: #e2e8f0;
    }
    body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 2rem 1rem; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { background-color: var(--card-bg); padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); width: 100%; max-width: 450px; }
    
    /* MEJORA DE ESPACIADO: Se añade margin-bottom a los grupos de formulario */
    .form-group { margin-bottom: 2rem !important; } 
    
    .label-filtro { display: block; font-size: 0.95rem; font-weight: 700; color: var(--purple-dark); margin-bottom: 0.8rem; }
    select { width: 100%; padding: 0.85rem 1rem; font-size: 1rem; background-color: var(--bg); border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 0.85rem; font-size: 1rem; font-weight: 600; color: white; background-color: var(--primary); border: none; border-radius: 8px; cursor: pointer; transition: background 0.3s; }
    button:disabled { background-color: var(--border); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="paginaFiltros" class="container">
    <h1 style="font-size: 1.4rem; margin-bottom: 2rem; text-align: center;">Dirección Nacional de Adultos</h1>
    
    <div class="form-group">
      <label for="selectA" class="label-filtro">Área Estratégica</label>
      <select id="selectA" onchange="cambioArea()">
        <option value="">Conectando...</option>
      </select>
    </div>

    <div id="grupoC" class="form-group hidden">
      <label for="selectC" class="label-filtro">Nombre</label>
      <select id="selectC" onchange="activarBotonConsultar()">
        <option value="">-- Seleccione un nombre --</option>
      </select>
    </div>

    <button id="btnConsultar" disabled onclick="irAPaginaReporte()">Consultar</button>
  </div>

  <script>
    // Tu lógica funcional permanece intacta
    const API_URL = "https://script.google.com/macros/s/AKfycbw4okkl5_lnmqxK6b2eFL1uG6f92_Fu8BHDun4tvGtrexAECEAdEk1Kf3P9AfL29EH4/exec";
    let baseDatosCompleta = [];

    window.onload = function() { 
        fetch(API_URL).then(r => r.json()).then(data => { 
            baseDatosCompleta = data; 
            var select = document.getElementById('selectA');
            let areas = [...new Set(data.map(item => item.columnaA))].filter(Boolean).sort();
            select.innerHTML = '<option value="">-- Seleccione un Área --</option>' + areas.map(a => `<option value="${a}">${a}</option>`).join('');
        });
    };

    function cambioArea() {
      var valorA = document.getElementById('selectA').value;
      var grupoC = document.getElementById('grupoC');
      var selectC = document.getElementById('selectC');
      if (!valorA) { grupoC.classList.add('hidden'); return; }
      let nombresFiltrados = baseDatosCompleta.filter(item => item.columnaA === valorA).map(item => item.nombre).filter(Boolean).sort();
      selectC.innerHTML = '<option value="">-- Seleccione un nombre --</option>' + nombresFiltrados.map(n => `<option value="${n}">${n}</option>`).join('');
      grupoC.classList.remove('hidden');
    }

    function activarBotonConsultar() { document.getElementById('btnConsultar').disabled = (document.getElementById('selectC').value === ""); }
    
    function irAPaginaReporte() { /* ... tu lógica de redirección ... */ }
  </script>
</body>
</html>
