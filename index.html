<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dirección Nacional de Adultos</title>
  <style>
    body { font-family: sans-serif; background: #f8fafc; padding: 2rem; display: flex; justify-content: center; }
    .container { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    .hidden { display: none !important; }
    select, button { width: 100%; margin-top: 10px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
    button { background: #6366f1; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
<div class="container">
  <h3>Dirección Nacional de Adultos</h3>
  <label>Área Estratégica</label>
  <select id="selArea" onchange="gestionarCascada('area')"><option>Cargando...</option></select>
  <div id="divComision" class="hidden">
    <label>Comisión</label>
    <select id="selComision" onchange="gestionarCascada('comision')"></select>
  </div>
  <div id="divNombre" class="hidden">
    <label>Nombre</label>
    <select id="selNombre"></select>
  </div>
  <button id="btnConsultar" onclick="consultar()">Consultar</button>
</div>

<script>
  const URL_API = "https://script.google.com/macros/s/AKfycbw4okkl5_lnmqxK6b2eFL1uG6f92_Fu8BHDun4tvGtrexAECEAdEk1Kf3P9AfL29EH4/exec"; 
  let datosGlobales = [];

  fetch(URL_API)
    .then(res => res.json())
    .then(data => {
      console.log("Datos recibidos:", data); // <--- MIRA ESTO EN LA CONSOLA (F12)
      datosGlobales = data;
      const areas = [...new Set(data.map(d => d.area))];
      document.getElementById('selArea').innerHTML = '<option value="">Seleccione Área...</option>' + 
        areas.map(a => `<option value="${a}">${a}</option>`).join('');
    })
    .catch(err => console.error("Error en fetch:", err));

  function gestionarCascada(nivel) {
    const area = document.getElementById('selArea').value;
    if (nivel === 'area') {
      const coms = [...new Set(datosGlobales.filter(d => d.area === area).map(d => d.comision))];
      document.getElementById('divComision').classList.toggle('hidden', coms.length === 0);
      document.getElementById('selComision').innerHTML = coms.map(c => `<option value="${c}">${c}</option>`).join('');
      document.getElementById('divNombre').classList.remove('hidden');
    }
    filtrarNombres();
  }

  function filtrarNombres() {
    const area = document.getElementById('selArea').value;
    const com = document.getElementById('selComision').value;
    const filtrados = datosGlobales.filter(d => d.area === area && (com === "" || d.comision === com));
    document.getElementById('selNombre').innerHTML = filtrados.map(d => `<option value="${d.nombre}">${d.nombre}</option>`).join('');
  }

  function consultar() { alert("Consultando: " + document.getElementById('selNombre').value); }
</script>
</body>
</html>
