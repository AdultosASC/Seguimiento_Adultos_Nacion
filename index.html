<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dirección Nacional de Adultos</title>
  <style>
    body { font-family: sans-serif; background: #f8fafc; padding: 2rem; display: flex; justify-content: center; }
    .container { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    
    /* Esta sección añade el aire que necesitabas sin tocar la lógica */
    .field-wrapper { margin-bottom: 1.5rem; }
    
    .hidden { display: none !important; }
    select, button { width: 100%; margin-top: 5px; padding: 12px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #6366f1; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:disabled { background: #cbd5e1; }
  </style>
</head>
<body>

<div class="container" id="paginaFiltros">
  <h3>Dirección Nacional de Adultos</h3>
  
  <div class="field-wrapper">
    <label>Área Estratégica</label>
    <select id="selectA" onchange="gestionarCascada('area')"><option>Cargando...</option></select>
  </div>
  
  <div id="grupoC" class="field-wrapper hidden">
    <label>Comisión</label>
    <select id="selectC" onchange="gestionarCascada('comision')"><option value="">Seleccione...</option></select>
  </div>

  <div id="grupoN" class="field-wrapper hidden">
    <label>Nombre</label>
    <select id="selectN" onchange="document.getElementById('btnConsultar').disabled = false"><option value="">Seleccione...</option></select>
  </div>
  
  <button id="btnConsultar" disabled onclick="consultar()">Consultar</button>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbw4okkl5_lnmqxK6b2eFL1uG6f92_Fu8BHDun4tvGtrexAECEAdEk1Kf3P9AfL29EH4/exec";
  let datosGlobales = [];

  fetch(API_URL)
    .then(res => res.json())
    .then(data => {
      datosGlobales = data;
      const areas = [...new Set(data.map(d => d.area).filter(a => a && a.trim() !== ""))];
      document.getElementById('selectA').innerHTML = '<option value="">Seleccione Área...</option>' + 
        areas.map(a => `<option value="${a}">${a}</option>`).join('');
    });

  function gestionarCascada(nivel) {
    const areaVal = document.getElementById('selectA').value;
    
    if (nivel === 'area') {
      const comisiones = [...new Set(datosGlobales
        .filter(d => d.area === areaVal && d.comision && d.comision.toString().trim() !== "")
        .map(d => d.comision))];
      
      const divCom = document.getElementById('grupoC');
      if (comisiones.length > 0) {
        divCom.classList.remove('hidden');
        document.getElementById('selectC').innerHTML = '<option value="">Seleccione Comisión...</option>' + 
          comisiones.map(c => `<option value="${c}">${c}</option>`).join('');
      } else {
        divCom.classList.add('hidden');
        document.getElementById('selectC').value = "";
      }
      document.getElementById('grupoN').classList.remove('hidden');
      filtrarNombres();
    } else {
      filtrarNombres();
    }
  }

  function filtrarNombres() {
    const areaVal = document.getElementById('selectA').value;
    const comVal = document.getElementById('selectC').value;
    const divComHidden = document.getElementById('grupoC').classList.contains('hidden');
    
    const filtrados = datosGlobales.filter(d => 
      d.area === areaVal && 
      d.nombre && d.nombre.trim() !== "" &&
      (divComHidden || d.comision === comVal)
    );
    
    document.getElementById('selectN').innerHTML = '<option value="">Seleccione Nombre...</option>' + 
      filtrados.map(d => `<option value="${d.nombre}">${d.nombre}</option>`).join('');
  }

  function consultar() {
    alert("Consultando: " + document.getElementById('selectN').value);
  }
</script>
</body>
</html>
