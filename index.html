<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dirección Nacional de Adultos</title>
  <style>
    :root { --primary: #6366f1; --purple-dark: #4c1d95; --bg: #f8fafc; --text: #1e293b; --border: #e2e8f0; --danger: #ef4444; }
    body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); padding: 2rem 1rem; }
    .container { background-color: white; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 850px; margin: auto; }
    .hidden { display: none !important; }
    .form-group { margin-bottom: 1.5rem; }
    .label-filtro { font-weight: 700; color: var(--purple-dark); display: block; margin-bottom: 0.5rem; }
    select, input { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; }
    button { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; cursor: pointer; color: white; background: var(--primary); font-weight: 600; }
    .seccion { background: #f1f5f9; padding: 1.5rem; border-radius: 12px; margin-bottom: 1.5rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .tabla-archivos { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    .tabla-archivos td { padding: 0.75rem; border-bottom: 1px solid var(--border); }
  </style>
</head>
<body>
  <div id="paginaFiltros" class="container">
    <h1>Dirección Nacional de Adultos</h1>
    <div class="form-group">
      <label class="label-filtro">Área</label>
      <select id="selectA" onchange="cambioArea()"><option value="">Cargando...</option></select>
    </div>
    <div id="grupoC" class="form-group hidden">
      <label class="label-filtro">Nombre</label>
      <select id="selectC" onchange="document.getElementById('btnConsultar').disabled = false"><option value="">-- Seleccione --</option></select>
    </div>
    <div style="display: flex; gap: 10px;">
        <button id="btnConsultar" disabled onclick="irAPaginaReporte()">Consultar</button>
        <button style="background: var(--purple-dark);" onclick="generarInforme()">Generar Informe</button>
    </div>
  </div>

  <div id="paginaReporte" class="container hidden">
    <h2 id="tituloColumnaA"></h2>
    <div class="seccion">
      <h3>Información General</h3>
      <div class="grid">
        <p><strong>Nombre:</strong> <span id="valNombre"></span></p>
        <p><strong>Cargo:</strong> <span id="valCargo"></span></p>
        <p><strong>Fecha Fin:</strong> <span id="valFechaFin"></span></p>
      </div>
    </div>
    <div class="seccion">
      <h3>Formación Básica</h3>
      <div id="datosBasica"></div>
    </div>
    <div class="seccion">
      <h3>Perfeccionamiento Continuo</h3>
      <div id="datosPerf"></div>
    </div>
    <div class="seccion">
      <h3>📁 Expediente Documental</h3>
      <table class="tabla-archivos"><tbody id="cuerpoTablaArchivos"></tbody></table>
      <div style="margin-top:1rem;">
        <select id="tipoDocCarga"><option value="Resolucion">Resolución</option><option value="Acuerdo">Acuerdo</option></select>
        <input type="file" id="inputArchivo">
        <button onclick="procesarSubidaArchivo()">Subir Archivo</button>
      </div>
    </div>
    <button onclick="volver()">Volver</button>
  </div>

  <script>
    const API_URL = "TU_URL_AQUÍ";
    let baseDatos = []; let usuario = null;

    window.onload = () => { fetch(API_URL).then(r => r.json()).then(d => { baseDatos = d; inicializarA(); }); };

    function inicializarA() {
      let sel = document.getElementById('selectA');
      let areas = [...new Set(baseDatos.map(i => i.columnaA))].sort();
      areas.forEach(a => { let o = document.createElement('option'); o.value = a; o.textContent = a; sel.appendChild(o); });
    }

    function cambioArea() {
      let area = document.getElementById('selectA').value;
      let selC = document.getElementById('selectC');
      selC.innerHTML = '<option value="">-- Seleccione --</option>';
      baseDatos.filter(i => i.columnaA === area).forEach(i => { let o = document.createElement('option'); o.value = i.nombre; o.textContent = i.nombre; selC.appendChild(o); });
      document.getElementById('grupoC').classList.remove('hidden');
    }

    function irAPaginaReporte() {
      usuario = baseDatos.find(i => i.nombre === document.getElementById('selectC').value);
      document.getElementById('paginaFiltros').classList.add('hidden');
      document.getElementById('paginaReporte').classList.remove('hidden');
      
      document.getElementById('valNombre').textContent = usuario.nombre;
      document.getElementById('valCargo').textContent = usuario.cargo;
      document.getElementById('valFechaFin').textContent = usuario.fechaFinalizacion;
      
      // Mostrar estados de Formación
      document.getElementById('datosBasica').innerHTML = `Inicial: ${usuario.valoracionInicial?'✅':'❌'} | PPD: ${usuario.desarrolloPPD?'✅':'❌'} | Final: ${usuario.valoracionFinal?'✅':'❌'}`;
      document.getElementById('datosPerf').innerHTML = `Inicial: ${usuario.s4ValoracionInicial?'✅':'❌'} | PPD: ${usuario.s4DesarrolloPPD?'✅':'❌'} | Final: ${usuario.s4ValoracionFinal?'✅':'❌'}`;
      
      solicitarArchivos();
    }

    function solicitarArchivos() {
      fetch(API_URL + "?accion=listarFiles&urlCarpeta=" + encodeURIComponent(usuario.carpetaDrive))
        .then(r => r.json()).then(res => {
          let tbody = document.getElementById('cuerpoTablaArchivos');
          tbody.innerHTML = "";
          res.archivos.forEach(f => {
            tbody.innerHTML += `<tr><td>${f.nombre}</td><td><button class="btn-mini" onclick="eliminar('${f.id}')">🗑️</button></td></tr>`;
          });
        });
    }

    function generarInforme() {
      let area = document.getElementById('selectA').value;
      if (!area) return;
      let filtrados = baseDatos.filter(u => u.columnaA === area);
      let win = window.open('', '_blank');
      let html = `<html><body><h1>Informe: ${area}</h1>`;
      filtrados.forEach(u => {
        let cant = 0; // Aquí deberías integrar la lógica de conteo real si tienes acceso a las carpetas
        html += `<div><h3>${u.nombre}</h3><p>Básica: ${u.valoracionInicial?'✅':'❌'} | Perf: ${u.s4ValoracionInicial?'✅':'❌'}</p><p>Cumplimiento carga: ${cant}/6</p></div><hr>`;
      });
      win.document.write(html + "</body></html>");
      win.print();
    }

    function volver() { document.getElementById('paginaReporte').classList.add('hidden'); document.getElementById('paginaFiltros').classList.remove('hidden'); }
    function procesarSubidaArchivo() { alert("Subiendo..."); }
    function eliminar(id) { alert("Eliminando..."); }
  </script>
</body>
</html>
