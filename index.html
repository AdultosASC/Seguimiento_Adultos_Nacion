<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Verificación DNA</title>
  <style>
    body { font-family: sans-serif; background: #f8fafc; padding: 2rem; display: flex; justify-content: center; }
    .container { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    .hidden { display: none !important; }
    #status { font-size: 0.8rem; color: #666; margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">
  <h3>Dirección Nacional de Adultos</h3>
  <div id="status">Conectando...</div>
  <select id="selArea" class="hidden" onchange="gestionarCascada('area')"></select>
  </div>

<script>
  // PEGA AQUÍ TU NUEVA URL DE GOOGLE (La que termina en /exec)
  const URL_API = "https://script.google.com/macros/s/AKfycbw4okkl5_lnmqxK6b2eFL1uG6f92_Fu8BHDun4tvGtrexAECEAdEk1Kf3P9AfL29EH4/exec"; 
  let datosGlobales = [];

  // Usamos una función de carga más segura
  function cargarDatos() {
    const script = document.createElement('script');
    script.src = URL_API + "?callback=setData";
    script.onload = () => document.getElementById('status').innerText = "Datos cargados correctamente";
    script.onerror = () => document.getElementById('status').innerText = "Error: Google Apps Script bloqueó la conexión. Revisa el despliegue.";
    document.body.appendChild(script);
  }

  function setData(data) {
    datosGlobales = data;
    document.getElementById('status').classList.add('hidden');
    document.getElementById('selArea').classList.remove('hidden');
    // Llenar selectores...
    const areas = [...new Set(data.map(d => d.area).filter(a => a))];
    document.getElementById('selArea').innerHTML = '<option value="">Seleccione Área...</option>' + areas.map(a => `<option value="${a}">${a}</option>`).join('');
  }

  cargarDatos();
</script>
</body>
</html>
