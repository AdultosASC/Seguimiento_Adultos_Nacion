<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard DNA</title>
</head>
<body>
  <h3>Dirección Nacional de Adultos</h3>
  <select id="selArea"><option>Cargando datos...</option></select>

  <script>
    const URL_API = "https://script.google.com/macros/s/AKfycbw4okkl5_lnmqxK6b2eFL1uG6f92_Fu8BHDun4tvGtrexAECEAdEk1Kf3P9AfL29EH4/exec";

    fetch(URL_API, {
      method: 'GET',
      mode: 'cors',
      headers: { 'Content-Type': 'application/json' }
    })
    .then(response => {
      if (!response.ok) throw new Error("Error en la respuesta");
      return response.json();
    })
    .then(data => {
      console.log("Datos recibidos:", data);
      const areas = [...new Set(data.map(d => d.area))];
      document.getElementById('selArea').innerHTML = '<option>Seleccione Área</option>' + 
        areas.map(a => `<option value="${a}">${a}</option>`).join('');
    })
    .catch(error => {
      console.error("Error de conexión:", error);
      document.getElementById('selArea').innerHTML = '<option>Error de carga. Revisa la consola.</option>';
    });
  </script>
</body>
</html>
