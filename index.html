<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Consulta DNA</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; background: #f8fafc; }
    .container { background: white; padding: 2rem; border-radius: 16px; width: 100%; max-width: 400px; margin: auto; }
    select, button { width: 100%; margin-top: 10px; padding: 10px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <h3>Dirección Nacional de Adultos</h3>
  <label>Área Estratégica</label>
  <select id="selArea" onchange="gestionarCascada('area')"><option>Cargando...</option></select>
  
  <div id="divComision" class="hidden">
    <label>Comisión</label>
    <select id="selComision" onchange="gestionarCascada('comision')"></select>
  </div>

  <div id="divNombre" class="hidden">
    <label>Nombre</label>
    <select id="selNombre"></select>
  </div>
  <button onclick="alert('Consultando...')">Consultar</button>
</div>

<script>
  // PEGA AQUÍ TU URL DE LA WEB APP (la que termina en /exec)
  const URL_API = "TU_URL_AQUI"; 
  let datosGlobales = [];

  fetch(URL_API)
    .then(res => res.json())
    .then(data => {
      datosGlobales = data;
      const areas = [...new Set(data.map(d => d.area))];
      document.getElementById('selArea').innerHTML = '<option value="">Seleccione Área...</option>' + areas.map(a => `<option value="${a}">${a}</option>`).join('');
    });

  function gestionarCascada(nivel) {
    const area = document.getElementById('selArea').value;
    if (nivel === 'area') {
      const coms = [...new Set(datosGlobales.filter(d => d.area === area).map(d => d.comision))];
      document.getElementById('divComision').classList.toggle('hidden', coms.length === 0);
      document.getElementById('selComision').innerHTML = coms.map(c => `<option value="${c}">${c}</option>`).join('');
    }
    const com = document.getElementById('selComision').value;
    const filtrados = datosGlobales.filter(d => d.area === area && (com === "" || d.comision === com));
    document.getElementById('divNombre').classList.remove('hidden');
    document.getElementById('selNombre').innerHTML = filtrados.map(d => `<option value="${d.nombre}">${d.nombre}</option>`).join('');
  }
</script>
</body>
</html>
