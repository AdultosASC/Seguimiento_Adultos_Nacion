<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dirección Nacional de Adultos</title>
  <style>
    body { font-family: sans-serif; background: #f8fafc; padding: 2rem; display: flex; justify-content: center; }
    .container { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    .hidden { display: none !important; }
    select, button { width: 100%; margin-top: 10px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
    button { background: #6366f1; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <h3>Dirección Nacional de Adultos</h3>
  <label>Área Estratégica</label>
  <select id="selArea" onchange="gestionarCascada('area')"><option>Cargando datos...</option></select>
  
  <div id="divComision" class="hidden">
    <label>Comisión</label>
    <select id="selComision" onchange="gestionarCascada('comision')"><option value="">Seleccione...</option></select>
  </div>

  <div id="divNombre" class="hidden">
    <label>Nombre</label>
    <select id="selNombre" onchange="document.getElementById('btnConsultar').disabled = false"><option value="">Seleccione...</option></select>
  </div>
  <button id="btnConsultar" disabled onclick="consultar()">Consultar</button>
</div>

<script>
  const URL_API = "https://script.google.com/macros/s/AKfycbw4okkl5_lnmqxK6b2eFL1uG6f92_Fu8BHDun4tvGtrexAECEAdEk1Kf3P9AfL29EH4/exec"; 
  let datosGlobales = [];

  // La forma que siempre ha funcionado: Inyectar el script
  const script = document.createElement('script');
  script.src = URL_API + "?callback=setData";
  document.body.appendChild(script);

  function setData(data) {
    datosGlobales = data;
    const sel = document.getElementById('selArea');
    const areas = [...new Set(data.map(d => d.area).filter(a => a))];
    sel.innerHTML = '<option value="">Seleccione Área...</option>' + areas.map(a => `<option value="${a}">${a}</option>`).join('');
  }

  function gestionarCascada(nivel) {
    const areaVal = document.getElementById('selArea').value;
    if (nivel === 'area') {
      const comisiones = [...new Set(datosGlobales.filter(d => d.area === areaVal && d.comision !== "N/A").map(d => d.comision))];
      const div = document.getElementById('divComision');
      if (comisiones.length > 0) {
        div.classList.remove('hidden');
        document.getElementById('selComision').innerHTML = '<option value="">Seleccione Comisión...</option>' + comisiones.map(c => `<option value="${c}">${c}</option>`).join('');
      } else {
        div.classList.add('hidden');
      }
      document.getElementById('divNombre').classList.remove('hidden');
    }
    filtrarNombres();
  }

  function filtrarNombres() {
    const areaVal = document.getElementById('selArea').value;
    const comVal = document.getElementById('selComision').value;
    const filtrados = datosGlobales.filter(d => d.area === areaVal && (comVal === "" || d.comision === comVal));
    document.getElementById('selNombre').innerHTML = '<option value="">Seleccione Nombre...</option>' + filtrados.map(d => `<option value="${d.nombre}">${d.nombre}</option>`).join('');
  }

  function consultar() {
    alert("Consultando: " + document.getElementById('selNombre').value);
  }
</script>
</body>
</html>
