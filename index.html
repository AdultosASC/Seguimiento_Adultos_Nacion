<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dirección Nacional de Adultos</title>
  <style>
    body { font-family: sans-serif; background: #f8fafc; padding: 2rem; }
    .container { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; margin: auto; }
    .hidden { display: none !important; }
    select, button { width: 100%; margin-top: 10px; padding: 10px; }
  </style>
</head>
<body>
<div class="container" id="paginaFiltros">
  <h3>Dirección Nacional de Adultos</h3>
  <select id="selectA" onchange="gestionarCascada('area')"><option value="">Cargando...</option></select>
  <div id="grupoC" class="hidden"><select id="selectC" onchange="gestionarCascada('comision')"></select></div>
  <div id="grupoN" class="hidden"><select id="selectN"></select></div>
  <button id="btnConsultar" disabled onclick="consultar()">Consultar</button>
</div>

<div class="container hidden" id="paginaReporte">
  <h3 id="nombreReporte"></h3>
  <div id="detalleReporte"></div>
  <button onclick="volver()">Volver</button>
</div>

<script>
  const API_URL = "TU_URL_AQUI"; 
  let datosGlobales = [];

  fetch(API_URL).then(res => res.json()).then(data => {
    datosGlobales = data;
    const areas = [...new Set(data.map(d => d.area))];
    document.getElementById('selectA').innerHTML = '<option value="">Seleccione Área...</option>' + 
      areas.map(a => `<option value="${a}">${a}</option>`).join('');
  });

  function gestionarCascada(nivel) {
    const area = document.getElementById('selectA').value;
    if (nivel === 'area') {
      const coms = [...new Set(datosGlobales.filter(d => d.area === area).map(d => d.comision))];
      document.getElementById('grupoC').classList.toggle('hidden', coms.length === 0);
      document.getElementById('selectC').innerHTML = coms.map(c => `<option value="${c}">${c}</option>`).join('');
      document.getElementById('grupoN').classList.remove('hidden');
    }
    const com = document.getElementById('selectC').value;
    const filtrados = datosGlobales.filter(d => d.area === area && (com === "" || d.comision === com));
    document.getElementById('selectN').innerHTML = filtrados.map(d => `<option value="${d.nombre}">${d.nombre}</option>`).join('');
    document.getElementById('btnConsultar').disabled = false;
  }

  function consultar() {
    const usuario = datosGlobales.find(d => d.nombre === document.getElementById('selectN').value);
    document.getElementById('paginaFiltros').classList.add('hidden');
    document.getElementById('paginaReporte').classList.remove('hidden');
    document.getElementById('detalleReporte').innerHTML = `
      <p><strong>Cargo:</strong> ${usuario.cargo}</p>
      <p><strong>Comisión:</strong> ${usuario.comision}</p>
      <p><strong>GN:</strong> ${usuario.gn}</p>
      <p><strong>AAA:</strong> ${usuario.aaa}</p>
    `;
  }

  function volver() { location.reload(); }
</script>
</body>
</html>
