<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dirección Nacional de Adultos</title>
  <style>
    :root { 
      --primary: #6366f1; --primary-hover: #4f46e5; --purple-dark: #4c1d95; --purple-light: #8b5cf6;
      --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --text-light: #64748b; --border: #e2e8f0;
      --success: #10b981; --danger: #ef4444;
    }
    body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 2rem 1rem; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
    .container { background-color: var(--card-bg); padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); width: 100%; max-width: 450px; }
    .container.wide { max-width: 850px; }
    .hidden { display: none !important; }
    /* ... (resto de tus estilos originales igual) ... */
  </style>
</head>
<body>
  <div id="paginaFiltros" class="container">...</div>
  <div id="paginaReporte" class="container wide hidden">...</div>

  <script>
    // ... [Variables y funciones de carga inicial IGUALES] ...

    function irAPaginaReporte() {
      var valorA = document.getElementById('selectA').value;
      var valorC = document.getElementById('selectC').value;
      usuarioSeleccionado = baseDatosCompleta.find(item => item.columnaA === valorA && item.nombre === valorC);
      if(!usuarioSeleccionado) return;

      document.getElementById('paginaFiltros').classList.add('hidden');
      document.getElementById('paginaReporte').classList.remove('hidden');

      // 1. CARGA ORIGINAL DE DATOS
      document.getElementById('tituloColumnaA').textContent = usuarioSeleccionado.columnaA || "";
      document.getElementById('valNombre').textContent = usuarioSeleccionado.nombre || "";
      // ... (sigue tu lógica de asignación original)

      // --- CAMBIO 1: Formación Básica + GN Rojo ---
      document.getElementById('valAsesorPersonal').textContent = usuarioSeleccionado.asesorPersonal || "";
      mapearIconoEstado('statusPPD', usuarioSeleccionado.desarrolloPPD);
      
      var boxGestor = document.getElementById('boxGestor');
      var fGestor = formatearFechaVisual(usuarioSeleccionado.gestorNacionalFecha);
      if (fGestor && fGestor !== "N/A") {
          document.getElementById('valGestorFecha').textContent = "Fecha de registro: " + fGestor;
          document.getElementById('valGestorFecha').style.color = "var(--danger)";
          boxGestor.style.borderColor = "var(--danger)";
          boxGestor.style.borderStyle = "dashed";
          boxGestor.classList.remove('hidden');
      } else {
          boxGestor.classList.add('hidden');
      }

      // --- CAMBIO 2: PC:PPD Corregido (usando s4DesarrolloPPD) ---
      mapearIconoEstado('statusS4PPD', usuarioSeleccionado.s4DesarrolloPPD);
      
      // ... (resto de tu lógica original intacta)
      
      document.getElementById('loaderReporte').classList.add('hidden');
      document.getElementById('contenidoReporte').classList.remove('hidden');
      solicitarListaArchivosDrive();
    }
    
    // ... (El resto de tus funciones: solicitarListaArchivosDrive, procesarSubidaArchivo, etc., siguen igual)
  </script>
</body>
</html>
