<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dirección Nacional de Adultos</title>
  <style>
    :root { --primary: #6366f1; --purple-dark: #4c1d95; --bg: #f8fafc; --success: #10b981; --danger: #ef4444; --green-bg: #f0fdf4; --green-border: #bbf7d0; --green-text: #166534; }
    body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); padding: 2rem 1rem; }
    .container { max-width: 850px; margin: auto; background: white; padding: 2.5rem; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .hidden { display: none !important; }
    .seccion-reporte { background: var(--bg); border: 1px solid #e2e8f0; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .tabla-archivos { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    .tabla-archivos th, .tabla-archivos td { padding: 0.75rem; border: 1px solid #e2e8f0; text-align: center; }
    .btn-mini { padding: 0.4rem 0.8rem; cursor: pointer; }
  </style>
</head>
<body>
  <div id="paginaFiltros" class="container">
    <h1>Consulta de Información</h1>
    <select id="selectA" onchange="cambioArea()"><option value="">Seleccione Área...</option></select>
    <select id="selectC" class="hidden" onchange="document.getElementById('btnConsultar').disabled=false"><option value="">-- Seleccione Nombre --</option></select>
    <button id="btnConsultar" disabled onclick="irAPaginaReporte()">Consultar</button>
  </div>

  <div id="paginaReporte" class="container hidden">
    <div id="contenidoReporte" class="hidden">
      <div class="seccion-reporte">
        <h2>📁 Expediente Documental</h2>
        <div id="loaderArchivos" class="hidden">Consultando carpeta...</div>
        <table class="tabla-archivos">
          <thead><tr><th>Nombre</th><th>Acciones</th></tr></thead>
          <tbody id="cuerpoTablaArchivos"></tbody>
        </table>
      </div>
      <button onclick="location.reload()">Volver</button>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxg6vaqC8w8IsCjHHy9UX9TTyf2nJKhlA1J37nvQEJb6ERK4nSQM5pAO7o8bqBYUj-0SQ/exec"; 
    let baseDatosCompleta = [], usuarioSeleccionado = null;

    window.onload = () => {
      fetch(API_URL).then(r => r.json()).then(d => { baseDatosCompleta = d; inicializarA(); });
    };

    function inicializarA() {
      let sel = document.getElementById('selectA');
      [...new Set(baseDatosCompleta.map(i => i.columnaA))].filter(Boolean).forEach(a => sel.innerHTML += `<option value="${a}">${a}</option>`);
    }

    function cambioArea() {
      let filtrados = baseDatosCompleta.filter(i => i.columnaA === document.getElementById('selectA').value);
      let selC = document.getElementById('selectC');
      selC.innerHTML = '<option value="">-- Seleccione --</option>';
      filtrados.forEach(n => selC.innerHTML += `<option value="${n.nombre}">${n.nombre}</option>`);
      selC.classList.remove('hidden');
    }

    function irAPaginaReporte() {
      usuarioSeleccionado = baseDatosCompleta.find(i => i.nombre === document.getElementById('selectC').value);
      document.getElementById('paginaFiltros').classList.add('hidden');
      document.getElementById('paginaReporte').classList.remove('hidden');
      document.getElementById('contenidoReporte').classList.remove('hidden');
      solicitarListaArchivosDrive();
    }

    function solicitarListaArchivosDrive() {
      const cuerpo = document.getElementById('cuerpoTablaArchivos');
      const loader = document.getElementById('loaderArchivos');
      
      if (!usuarioSeleccionado || !usuarioSeleccionado.carpetaDrive) {
        cuerpo.innerHTML = '<tr><td colspan="2">No hay carpeta definida.</td></tr>';
        return;
      }

      loader.classList.remove('hidden');
      console.log("URL enviada al API:", usuarioSeleccionado.carpetaDrive);

      // Usamos encodeURIComponent para asegurar que la URL llegue limpia al GS
      fetch(API_URL + "?accion=listarFiles&urlCarpeta=" + encodeURIComponent(usuarioSeleccionado.carpetaDrive))
        .then(res => res.json())
        .then(res => {
          loader.classList.add('hidden');
          if (res.resultado === "OK") {
            cuerpo.innerHTML = "";
            res.archivos.forEach(f => {
              cuerpo.innerHTML += `<tr><td>${f.nombre}</td><td>
                <button class="btn-mini" onclick="window.open('${f.url}', '_blank')">👁️</button>
                <button class="btn-mini" onclick="eliminarArchivo('${f.id}')">🗑️</button>
              </td></tr>`;
            });
          } else {
            cuerpo.innerHTML = `<tr><td colspan="2">Error: ${res.mensaje || 'No se pudo leer la carpeta'}</td></tr>`;
          }
        }).catch(e => {
          loader.classList.add('hidden');
          cuerpo.innerHTML = "<tr><td colspan='2'>Error de conexión con Drive.</td></tr>";
        });
    }

    function eliminarArchivo(id) {
      fetch(API_URL, { method: "POST", body: JSON.stringify({ accion: "eliminar", fileId: id }) })
        .then(() => solicitarListaArchivosDrive());
    }

    function procesarSubidaArchivo() { /* ... tu lógica ... */ }
  </script>
</body>
</html>
