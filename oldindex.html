<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dirección Nacional de Adultos</title>
  <style>
    :root { --primary: #6366f1; --primary-hover: #4f46e5; --purple-dark: #4c1d95; --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --text-light: #64748b; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --green-bg: #f0fdf4; --green-border: #bbf7d0; --green-text: #166534; }
    body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 2rem 1rem; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
    .container { background-color: var(--card-bg); padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); width: 100%; max-width: 450px; }
    .container.wide { max-width: 850px; }
    .hidden { display: none !important; }
    .titulo-principal-a { color: var(--purple-dark); font-weight: bold; font-size: 1.8rem; margin-bottom: 1.5rem; border-bottom: 2px solid var(--border); padding-bottom: 0.5rem; }
    .seccion-reporte { background-color: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .tabla-archivos { width: 100%; border-collapse: collapse; margin-top: 0.5rem; background: white; }
    .tabla-archivos th, .tabla-archivos td { padding: 0.75rem; border: 1px solid var(--border); text-align: center; }
    button { width: 100%; padding: 0.75rem; background-color: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; }
    .btn-mini { width: auto; padding: 0.4rem 0.8rem; }
  </style>
</head>
<body>
  <div id="paginaFiltros" class="container">
    <h1>Consulta de Información</h1>
    <select id="selectA" onchange="cambioArea()"><option value="">Cargando base de datos...</option></select>
    <div id="grupoC" class="hidden"><select id="selectC" onchange="document.getElementById('btnConsultar').disabled=false"><option value="">-- Nombre --</option></select></div>
    <button id="btnConsultar" disabled onclick="irAPaginaReporte()">Consultar</button>
  </div>

  <div id="paginaReporte" class="container wide hidden">
    <div id="tituloColumnaA" class="titulo-principal-a"></div>
    <div id="contenidoReporte">
      <div class="seccion-reporte">
        <h2>Formación Básica</h2>
        <div id="statusValInicial">Valoración Inicial: <span></span></div>
        <div id="statusValFinal">Valoración Final: <span></span></div>
      </div>
      <div class="seccion-reporte">
        <h2>Perfeccionamiento Continuo</h2>
        <div id="statusS4ValInicial">Val. Inicial: <span></span></div>
        <div id="statusPCPPD">Desarrollo PPD: <span></span></div>
        <div id="statusS4ValFinal">Val. Final: <span></span></div>
      </div>
      <div class="seccion-reporte">
        <h2>📁 Expediente Documental</h2>
        <div id="loaderArchivos" class="hidden">Consultando archivos...</div>
        <table class="tabla-archivos"><tbody id="cuerpoTablaArchivos"></tbody></table>
      </div>
    </div>
    <button onclick="location.reload()">Volver</button>
  </div>

  <script>
    const API_URL = "TU_URL_DE_APPS_SCRIPT_AQUI"; // Asegúrate de poner tu URL aquí
    let baseDatosCompleta = [], usuarioSeleccionado = null;

    window.onload = () => {
        fetch(API_URL).then(r => r.json()).then(d => {
            baseDatosCompleta = d;
            let areas = [...new Set(d.map(i => i.columnaA))];
            document.getElementById('selectA').innerHTML = '<option value="">-- Área --</option>' + areas.map(a => `<option value="${a}">${a}</option>`).join('');
        });
    };

    function cambioArea() {
        let n = baseDatosCompleta.filter(i => i.columnaA === document.getElementById('selectA').value);
        document.getElementById('selectC').innerHTML = '<option value="">-- Nombre --</option>' + n.map(i => `<option value="${i.nombre}">${i.nombre}</option>`).join('');
        document.getElementById('grupoC').classList.remove('hidden');
    }

    function irAPaginaReporte() {
        usuarioSeleccionado = baseDatosCompleta.find(i => i.nombre === document.getElementById('selectC').value);
        document.getElementById('paginaFiltros').classList.add('hidden');
        document.getElementById('paginaReporte').classList.remove('hidden');
        
        // Mapeo correcto según tu codigo.gs
        mapear('statusValInicial', usuarioSeleccionado.valoracionInicial);
        mapear('statusValFinal', usuarioSeleccionado.valoracionFinal);
        mapear('statusS4ValInicial', usuarioSeleccionado.s4ValoracionInicial);
        mapear('statusPCPPD', usuarioSeleccionado.PCPPD); // Clave exacta del .gs
        mapear('statusS4ValFinal', usuarioSeleccionado.s4ValoracionFinal);
        
        solicitarListaArchivosDrive();
    }

    function mapear(id, val) {
        let el = document.getElementById(id).querySelector('span');
        let ok = (val == 1 || val == "1" || val == "TRUE" || val == true);
        el.textContent = ok ? "✔️" : "❌";
        el.style.color = ok ? "var(--success)" : "var(--danger)";
    }

    function solicitarListaArchivosDrive() {
        const cuerpo = document.getElementById('cuerpoTablaArchivos');
        const loader = document.getElementById('loaderArchivos');
        loader.classList.remove('hidden');
        
        fetch(`${API_URL}?accion=listarFiles&urlCarpeta=${encodeURIComponent(usuarioSeleccionado.carpetaDrive)}`)
            .then(r => r.json()).then(res => {
                loader.classList.add('hidden');
                cuerpo.innerHTML = res.archivos.map(f => `<tr><td>${f.nombre}</td><td><button class="btn-mini" onclick="window.open('${f.url}')">👁️</button><button class="btn-mini" onclick="eliminar('${f.id}')">🗑️</button></td></tr>`).join('');
            });
    }

    function eliminar(id) {
        fetch(API_URL, { method: "POST", body: JSON.stringify({ accion: "eliminar", fileId: id }) })
            .then(() => solicitarListaArchivosDrive());
    }
  </script>
</body>
</html>
