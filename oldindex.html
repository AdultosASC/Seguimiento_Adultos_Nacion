<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dirección Nacional de Adultos</title>
  <style>
    :root { --primary: #6366f1; --purple-dark: #4c1d95; --bg: #f8fafc; --text: #1e293b; --success: #10b981; --danger: #ef4444; }
    body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); padding: 2rem 1rem; }
    .container { background: #fff; padding: 2rem; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 850px; margin: auto; }
    .hidden { display: none !important; }
    .seccion-reporte { background: #f8fafc; padding: 1.5rem; margin-bottom: 1rem; border-radius: 12px; border: 1px solid #e2e8f0; }
    .status-badge { font-size: 1.2rem; font-weight: bold; }
    .btn-back { background: #64748b; color: white; padding: 0.5rem 1rem; border-radius: 8px; border: none; cursor: pointer; }
    .tabla-archivos { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
    .tabla-archivos th, .tabla-archivos td { padding: 0.75rem; border-bottom: 1px solid #e2e8f0; text-align: left; }
    .btn-mini { padding: 0.3rem 0.6rem; font-size: 0.8rem; cursor: pointer; }
  </style>
</head>
<body>

  <div id="paginaFiltros" class="container" style="max-width: 450px;">
    <h1>Consulta de Información</h1>
    <select id="selectA" onchange="cambioArea()"><option value="">Cargando base de datos...</option></select>
    <select id="selectC" class="hidden" onchange="activarBotonConsultar()"><option value="">-- Seleccione un nombre --</option></select>
    <button id="btnConsultar" disabled onclick="irAPaginaReporte()">Consultar</button>
  </div>

  <div id="paginaReporte" class="container hidden">
    <button class="btn-back" onclick="location.reload()">← Volver</button>
    <div id="contenidoReporte">
      <h2 id="tituloNombre"></h2>
      
      <div class="seccion-reporte">
        <h3>Información General</h3>
        <p>Tiempo restante en el cargo: <span id="valTiempoRestante" style="font-weight:bold;"></span></p>
      </div>

      <div class="seccion-reporte">
        <h3>Formación Básica</h3>
        <p>GN (Gestor Nacional): <span id="statusGN" class="status-badge"></span> <span id="fechaGN"></span></p>
      </div>

      <div class="seccion-reporte">
        <h3>Perfeccionamiento Continuo</h3>
        <p>PC: PPD: <span id="statusPCPPD" class="status-badge"></span></p>
        <p>AAA: <span id="statusAAA" class="status-badge"></span> <span id="fechaAAA"></span></p>
      </div>

      <div class="seccion-reporte">
        <h2>📁 Expediente Documental</h2>
        <table class="tabla-archivos" id="tablaFiles">
          <thead><tr><th>Archivo</th><th>Acciones</th></tr></thead>
          <tbody id="cuerpoTablaArchivos"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxg6vaqC8w8IsCjHHy9UX9TTyf2nJKhlA1J37nvQEJb6ERK4nSQM5pAO7o8bqBYUj-0SQ/exec"; 
    let baseDatosCompleta = [];
    let usuarioSeleccionado = null;

    fetch(API_URL).then(r => r.json()).then(data => {
      baseDatosCompleta = data;
      let areas = [...new Set(data.map(i => i.columnaA))].filter(Boolean).sort();
      let selA = document.getElementById('selectA');
      selA.innerHTML = '<option value="">-- Seleccione Área --</option>';
      areas.forEach(a => selA.innerHTML += `<option value="${a}">${a}</option>`);
    });

    function cambioArea() {
      let area = document.getElementById('selectA').value;
      let selC = document.getElementById('selectC');
      let nombres = baseDatosCompleta.filter(i => i.columnaA === area).map(i => i.nombre);
      selC.innerHTML = '<option value="">-- Seleccione Nombre --</option>';
      nombres.forEach(n => selC.innerHTML += `<option value="${n}">${n}</option>`);
      selC.classList.remove('hidden');
    }

    function activarBotonConsultar() { document.getElementById('btnConsultar').disabled = false; }

    function mapearIcono(id, val) {
      let el = document.getElementById(id);
      let esVerdadero = (String(val).toUpperCase() === "TRUE" || String(val) === "1" || String(val).toUpperCase() === "SI" || String(val).toUpperCase() === "VERDADERO");
      el.textContent = esVerdadero ? "✔️" : "❌";
      el.style.color = esVerdadero ? "var(--success)" : "var(--danger)";
    }

    function extraerEstructuraFecha(str) {
      if(!str || str === "N/A") return null;
      let d = new Date(str);
      return isNaN(d.getTime()) ? null : d;
    }

    function irAPaginaReporte() {
      let nombre = document.getElementById('selectC').value;
      usuarioSeleccionado = baseDatosCompleta.find(i => i.nombre === nombre);
      if(!usuarioSeleccionado) return;

      document.getElementById('paginaFiltros').classList.add('hidden');
      document.getElementById('paginaReporte').classList.remove('hidden');

      // Cálculo años y meses
      let fin = extraerEstructuraFecha(usuarioSeleccionado.fechaFinalizacion);
      if (fin) {
        let hoy = new Date();
        let diffY = fin.getFullYear() - hoy.getFullYear();
        let diffM = fin.getMonth() - hoy.getMonth();
        if (diffM < 0) { diffY--; diffM += 12; }
        document.getElementById('valTiempoRestante').textContent = `${diffY} años y ${diffM} meses`;
      }

      document.getElementById('tituloNombre').textContent = usuarioSeleccionado.nombre;
      
      // GN con estilo rojo
      mapearIcono('statusGN', usuarioSeleccionado.GN);
      let boxGN = document.getElementById('statusGN').parentElement;
      boxGN.style.backgroundColor = "#fee2e2"; boxGN.style.padding = "5px"; boxGN.style.borderRadius = "8px";
      
      document.getElementById('fechaGN').textContent = usuarioSeleccionado.fechaGN || "";
      mapearIcono('statusPCPPD', usuarioSeleccionado.PCPPD);
      mapearIcono('statusAAA', usuarioSeleccionado.AAA);
      document.getElementById('fechaAAA').textContent = usuarioSeleccionado.aaaFecha || "";
      
      solicitarListaArchivosDrive();
    }

    function solicitarListaArchivosDrive() {
      fetch(API_URL + "?accion=listarFiles&urlCarpeta=" + encodeURIComponent(usuarioSeleccionado.carpetaDrive))
        .then(res => res.json()).then(res => {
          let cuerpo = document.getElementById('cuerpoTablaArchivos');
          cuerpo.innerHTML = "";
          res.archivos.forEach(f => {
            cuerpo.innerHTML += `<tr><td>${f.nombre}</td><td><button class="btn-mini" onclick="window.open('${f.url}')">Ver</button></td></tr>`;
          });
        });
    }
  </script>
</body>
</html>
