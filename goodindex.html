<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dirección Nacional de Adultos</title>
  <style>
    /* Estilos profesionales aplicados */
    body { font-family: 'Segoe UI', sans-serif; background-color: #f8fafc; padding: 2rem; display: flex; justify-content: center; }
    .container { background: white; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 450px; }
    .label-filtro { font-weight: 700; color: #4c1d95; display: block; margin-bottom: 0.5rem; }
    select, button { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 1px solid #e2e8f0; border-radius: 8px; }
    button { background: #6366f1; color: white; border: none; cursor: pointer; font-weight: bold; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <div style="text-align:center; color:#4c1d95; font-weight:700; margin-bottom:1.5rem;">Dirección Nacional de Adultos</div>
  
  <label class="label-filtro">Área Estratégica</label>
  <select id="selArea" onchange="filtroCascada('area')"><option value="">Cargando...</option></select>

  <div id="divComision" class="hidden">
    <label class="label-filtro">Comisión</label>
    <select id="selComision" onchange="filtroCascada('comision')"><option value="">Seleccione...</option></select>
  </div>

  <div id="divNombre" class="hidden">
    <label class="label-filtro">Nombre</label>
    <select id="selNombre" onchange="document.getElementById('btnConsultar').disabled = false"><option value="">Seleccione...</option></select>
  </div>

  <button id="btnConsultar" disabled onclick="consultar()">Consultar</button>
</div>

<script>
  const URL_API = "https://script.google.com/macros/s/AKfycbzDSHPUh3EwJAWbkJWqr-9W2mhiLeNwadXDQ2GhmrY4iK6iW_kaZ0blE0ubKEA7YfJ-Lw/exec"; 
  let datos = [];

  // Llamado al API con JSONP
  const script = document.createElement('script');
  script.src = URL_API + "?callback=setData";
  document.body.appendChild(script);

  function setData(data) {
    datos = data;
    const areas = [...new Set(data.map(d => d.area))];
    const sel = document.getElementById('selArea');
    sel.innerHTML = '<option value="">Seleccione...</option>';
    areas.forEach(a => sel.innerHTML += `<option value="${a}">${a}</option>`);
  }

  function filtroCascada(nivel) {
    const area = document.getElementById('selArea').value;
    const comision = document.getElementById('selComision').value;

    if (nivel === 'area') {
      const comisiones = [...new Set(datos.filter(d => d.area === area && d.comision !== "N/A").map(d => d.comision))];
      const div = document.getElementById('divComision');
      if (comisiones.length > 0) {
        div.classList.remove('hidden');
        document.getElementById('selComision').innerHTML = '<option value="">Seleccione...</option>' + comisiones.map(c => `<option value="${c}">${c}</option>`).join('');
      } else {
        div.classList.add('hidden');
        filtroCascada('comision'); // Salta al nombre
      }
    }

    if (nivel === 'area' || nivel === 'comision') {
      const nombres = datos.filter(d => d.area === area && (comision === "" || d.comision === comision));
      document.getElementById('divNombre').classList.remove('hidden');
      document.getElementById('selNombre').innerHTML = '<option value="">Seleccione...</option>' + nombres.map(n => `<option value="${n.nombre}">${n.nombre}</option>`).join('');
    }
  }

  function consultar() {
    alert("Redirigiendo a ficha de: " + document.getElementById('selNombre').value);
  }
</script>
</body>
</html>
