<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dirección Nacional de Adultos</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; padding: 1.5rem; }
    .container { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 800px; margin: auto; }
    .hidden { display: none !important; }
    select, button, input { width: 100%; padding: 12px; margin-top: 8px; border-radius: 10px; border: 1px solid #e2e8f0; }
    button { background: #4f46e5; color: white; border: none; cursor: pointer; font-weight: 600; }
    .nav-buttons { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
    .nav-buttons button { width: auto; padding: 8px 16px; font-size: 0.85rem; background: #e0e7ff; color: #4f46e5; }
    .section-card { background: #fff; border: 1px solid #e2e8f0; padding: 1.5rem; border-radius: 16px; margin-bottom: 1.5rem; }
    .seccion-titulo { color: #4f46e5; font-weight: 800; text-transform: uppercase; margin-bottom: 1rem; border-left: 4px solid #4f46e5; padding-left: 10px; }
    .file-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #f1f5f9; }
    .btn-icon { width: 30px; height: 30px; padding: 4px; cursor: pointer; border: none; background: none; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { padding: 8px; border: 1px solid #e2e8f0; text-align: center; }
  </style>
</head>
<body>

<div class="container" id="paginaFiltros">
  <h2 style="text-align:center">Dirección Nacional de Adultos</h2>
  <div class="field-wrapper"><label>Área Estratégica</label><select id="selectA" onchange="filtrarNombres()"><option value="">Cargando...</option></select></div>
  <div id="grupoN" class="hidden"><label>Nombre</label><select id="selectN" onchange="document.getElementById('btnConsultar').disabled = false"><option value="">Seleccione...</option></select></div>
  <button id="btnConsultar" disabled onclick="consultar()">Consultar Datos</button>
</div>

<div class="container hidden" id="paginaReporte">
  <div id="areaAdmin" class="nav-buttons hidden">
    <button onclick="cambiarVista('vistaInformacionPersonal')">Personal</button>
    <button onclick="cambiarVista('dashBoard')">General</button>
    <button onclick="cambiarVista('vistaArea')">Área</button>
  </div>
  
  <div id="vistaInformacionPersonal">
    <div id="detalleReporte"></div>
    <div class="section-card">
        <div class="seccion-titulo">Documentos cargados</div>
        <div id="listaArchivos"></div>
        <hr style="border:0; border-top:1px solid #eee; margin:20px 0;">
        <div class="seccion-titulo">Cargar nuevo</div>
        <select id="tipoArchivo">
          <option value="Resolución nombramiento">Resolución nombramiento</option>
          <option value="Acuerdo mutuo">Acuerdo mutuo</option>
          <option value="Aval AP">Aval AP</option>
          <option value="Curso SfH1">Curso SfH1</option>
          <option value="Curso SfH2">Curso SfH2</option>
          <option value="Módulo de inducción">Módulo de inducción</option>
        </select>
        <input type="file" id="inputArchivo">
        <button onclick="subirArchivo()">Subir Archivo</button>
    </div>
  </div>
  
  <div id="dashBoard" class="hidden section-card">
    <div class="seccion-titulo">Consolidado Formación</div>
    <canvas id="chartBasica"></canvas>
  </div>

  <div id="vistaArea" class="hidden section-card">
    <div class="seccion-titulo">Información por Área</div>
    <select id="filtroArea" onchange="renderizarTablaArea()"></select>
    <select id="filtroComision" onchange="renderizarTablaArea()"><option value="">Todas las comisiones</option></select>
    <div id="tablaAreaContainer" style="overflow-x:auto; margin-top:20px"></div>
    <button onclick="alert('Funcionalidad de descarga en desarrollo')">Descargar Informe</button>
  </div>
  
  <button onclick="location.reload()" style="background:#64748b">Volver al inicio</button>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbw4okkl5_lnmqxK6b2eFL1uG6f92_Fu8BHDun4tvGtrexAECEAdEk1Kf3P9AfL29EH4/exec";
  let datosGlobales = [], usuarioActual = {};

  fetch(API_URL).then(res => res.json()).then(data => {
    datosGlobales = data;
    const areas = [...new Set(data.map(d => d.area).filter(a => a))];
    document.getElementById('selectA').innerHTML = '<option value="">Seleccione Área...</option>' + areas.map(a => `<option value="${a}">${a}</option>`).join('');
  });

  function cambiarVista(id) {
    document.getElementById('vistaInformacionPersonal').classList.toggle('hidden', id !== 'vistaInformacionPersonal');
    document.getElementById('dashBoard').classList.toggle('hidden', id !== 'dashBoard');
    document.getElementById('vistaArea').classList.toggle('hidden', id !== 'vistaArea');
    if(id === 'vistaArea') prepararFiltrosArea();
  }

  function prepararFiltrosArea() {
    const areas = [...new Set(datosGlobales.map(d => d.area))];
    document.getElementById('filtroArea').innerHTML = '<option value="">Seleccione Área...</option>' + areas.map(a => `<option value="${a}">${a}</option>`).join('');
  }

  function renderizarTablaArea() {
    const area = document.getElementById('filtroArea').value;
    const com = document.getElementById('filtroComision').value;
    let filtrados = datosGlobales.filter(d => d.area === area && (com === "" || d.comision === com));
    let html = `<table><tr><th>Nombre</th><th>FB: VI</th><th>FB: PPD</th><th>FB: VF</th><th>FB: GN</th><th>PC: VI</th><th>PC: PPD</th><th>PC: VF</th><th>PC: AAA</th></tr>`;
    filtrados.forEach(f => {
      html += `<tr><td>${f.nombre}</td><td>${getIcon(f.valoracionInicial)}</td><td>${getIcon(f.desarrolloPPD)}</td><td>${getIcon(f.valoracionFinal)}</td><td>${getIcon(f.gn)}</td><td>${getIcon(f.pcValoracionInicial)}</td><td>${getIcon(f.pcDesarrolloPPD)}</td><td>${getIcon(f.pcValoracionFinal)}</td><td>${getIcon(f.aaa)}</td></tr>`;
    });
    document.getElementById('tablaAreaContainer').innerHTML = html + "</table>";
  }

  function getIcon(v) { return (v == true || v == 'TRUE' || v == 1) ? '✅' : '❌'; }

  function consultar() {
    usuarioActual = datosGlobales.find(d => d.nombre === document.getElementById('selectN').value);
    document.getElementById('paginaFiltros').classList.add('hidden');
    document.getElementById('paginaReporte').classList.remove('hidden');
    if (usuarioActual.lider == true || usuarioActual.lider == "TRUE" || usuarioActual.lider == 1) document.getElementById('areaAdmin').classList.remove('hidden');
    // ... lógica de renderizado original ...
  }
  // ... funciones listarArchivos, subirArchivo, etc. sin cambios ...
</script>
</body>
</html>
