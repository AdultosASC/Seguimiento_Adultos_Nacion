<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dirección Nacional de Adultos</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; padding: 1.5rem; }
    .container { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 700px; margin: auto; }
    .hidden { display: none !important; }
    select, button, input { width: 100%; padding: 12px; margin-top: 8px; border-radius: 10px; border: 1px solid #e2e8f0; }
    button { background: #4f46e5; color: white; border: none; cursor: pointer; font-weight: 600; }
    .nav-buttons { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
    .nav-buttons button { width: auto; padding: 8px 16px; font-size: 0.85rem; background: #e0e7ff; color: #4f46e5; }
    .section-card { background: #fff; border: 1px solid #e2e8f0; padding: 1.5rem; border-radius: 16px; margin-bottom: 1.5rem; }
    .seccion-titulo { color: #4f46e5; font-weight: 800; text-transform: uppercase; margin-bottom: 1rem; border-left: 4px solid #4f46e5; padding-left: 10px; }
    .grid-reporte { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; align-items: center; }
    .card-resaltada { background: #4f46e5; color: white; padding: 1.2rem; border-radius: 12px; text-align: center; margin: 1rem 0; }
  </style>
</head>
<body>

<div class="container" id="paginaFiltros">
  <h2 style="text-align:center">Dirección Nacional de Adultos</h2>
  <div class="field-wrapper"><label>Área Estratégica</label><select id="selectA" onchange="filtrarNombres()"><option value="">Cargando...</option></select></div>
  <div id="grupoN" class="hidden"><label>Nombre</label><select id="selectN" onchange="document.getElementById('btnConsultar').disabled = false"></select></div>
  <button id="btnConsultar" disabled onclick="consultar()">Consultar Datos</button>
</div>

<div class="container hidden" id="paginaReporte">
  <div id="areaAdmin" class="nav-buttons hidden">
    <button onclick="cambiarVista('personal')">Información Personal</button>
    <button onclick="cambiarVista('general')">Información General</button>
    <button onclick="alert('Área')">Área</button>
  </div>
  
  <div id="vistaPersonal">
    <div id="detalleReporte"></div>
    <div class="section-card">
      <div class="seccion-titulo">Documentos cargados</div>
      <div id="listaArchivos"></div>
      <hr style="border:0; border-top:1px solid #eee; margin:20px 0;">
      <div class="seccion-titulo">Cargar nuevo</div>
      <select id="tipoArchivo">
        <option value="Resolución nombramiento">Resolución nombramiento</option>
        <option value="Acuerdo mutuo">Acuerdo mutuo</option>
        <option value="Aval AP">Aval AP</option>
        <option value="Curso SfH1">Curso SfH1</option>
        <option value="Curso SfH2">Curso SfH2</option>
        <option value="Módulo de inducción">Módulo de inducción</option>
      </select>
      <input type="file" id="inputArchivo">
      <button onclick="subirArchivo()">Subir Archivo</button>
    </div>
  </div>

  <div id="vistaGeneral" class="hidden">
    <div class="section-card">
      <div class="seccion-titulo">Formación Básica (Consolidado)</div>
      <canvas id="chartBasica"></canvas>
    </div>
    <div class="section-card">
      <div class="seccion-titulo">Perfeccionamiento Continuo (Consolidado)</div>
      <canvas id="chartPC"></canvas>
    </div>
  </div>

  <button onclick="location.reload()" style="background:#64748b">Volver al inicio</button>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbw4okkl5_lnmqxK6b2eFL1uG6f92_Fu8BHDun4tvGtrexAECEAdEk1Kf3P9AfL29EH4/exec";
  let datosGlobales = [], usuarioActual = {};

  fetch(API_URL).then(res => res.json()).then(data => { datosGlobales = data; const areas = [...new Set(data.map(d => d.area).filter(a => a))]; document.getElementById('selectA').innerHTML = '<option value="">Seleccione...</option>' + areas.map(a => `<option value="${a}">${a}</option>`).join(''); });

  function cambiarVista(v) {
    document.getElementById('vistaPersonal').classList.toggle('hidden', v !== 'personal');
    document.getElementById('vistaGeneral').classList.toggle('hidden', v !== 'general');
    if(v === 'general') renderizarDashboard();
  }

  function renderizarDashboard() {
    const contar = (key) => datosGlobales.filter(d => d[key] == true || d[key] == 1 || d[key] == 'TRUE').length;
    
    new Chart(document.getElementById('chartBasica'), { type: 'bar', data: { labels: ['Val. Inicial', 'PPD', 'Val. Final', 'Gestor Nac.'], datasets: [{ label: 'Completados', data: [contar('valoracionInicial'), contar('desarrolloPPD'), contar('valoracionFinal'), contar('gn')], backgroundColor: '#4f46e5' }] } });
    new Chart(document.getElementById('chartPC'), { type: 'bar', data: { labels: ['Val. Inicial', 'PPD', 'Val. Final', 'AAA'], datasets: [{ label: 'Completados', data: [contar('pcValoracionInicial'), contar('pcDesarrolloPPD'), contar('pcValoracionFinal'), contar('aaa')], backgroundColor: '#10b981' }] } });
  }

  function getIcon(v) { return (v == true || v == 'TRUE' || v == 1) ? '✅' : '❌'; }

  function consultar() {
    usuarioActual = datosGlobales.find(d => d.nombre === document.getElementById('selectN').value);
    document.getElementById('paginaFiltros').classList.add('hidden');
    document.getElementById('paginaReporte').classList.remove('hidden');
    if (usuarioActual.lider == true || usuarioActual.lider == "TRUE" || usuarioActual.lider == 1) document.getElementById('areaAdmin').classList.remove('hidden');
    
    let hoy = new Date(), fN = new Date(usuarioActual.fechaNombramiento), fFin = new Date(fN);
    fFin.setMonth(fN.getMonth() + parseInt(usuarioActual.duracionMeses || 0));
    let resto = (fFin < hoy) ? "Expirado" : "Pendiente";

    document.getElementById('detalleReporte').innerHTML = `
      <div class="section-card">
        <div class="seccion-titulo">INFORMACIÓN GENERAL</div>
        <p><strong>${usuarioActual.nombre}</strong></p>
        <div class="grid-reporte"><p><strong>Área:</strong><br>${usuarioActual.area}</p><p><strong>Cargo:</strong><br>${usuarioActual.cargo}</p></div>
        <div class="card-resaltada">Tiempo restante: ${resto}</div>
      </div>
      <div class="section-card">
        <div class="seccion-titulo">Formación Básica</div>
        <div class="form-grid">
          <div>${getIcon(usuarioActual.valoracionInicial)} Val. Inicial</div><div>F: ${usuarioActual.fechaValoracionInicial || '--'}</div>
          <div>${getIcon(usuarioActual.desarrolloPPD)} PPD</div><div></div>
          <div>${getIcon(usuarioActual.valoracionFinal)} Val. Final</div><div>F: ${usuarioActual.fechaValoracionFinal || '--'}</div>
          <div>${getIcon(usuarioActual.gn)} Gestor Nac.</div><div>F: ${usuarioActual.gestorNacionalFecha || '--'}</div>
        </div>
      </div>
      <div class="section-card">
        <div class="seccion-titulo">Perfeccionamiento Continuo</div>
        <div class="form-grid">
          <div>${getIcon(usuarioActual.pcValoracionInicial)} Val. Inicial</div><div>F: ${usuarioActual.pcFechaValoracionInicial || '--'}</div>
          <div>${getIcon(usuarioActual.pcDesarrolloPPD)} PPD</div><div></div>
          <div>${getIcon(usuarioActual.pcValoracionFinal)} Val. Final</div><div>F: ${usuarioActual.pcFechaValoracionFinal || '--'}</div>
          <div>${getIcon(usuarioActual.aaa)} AAA</div><div>F: ${usuarioActual.aaaFecha || '--'}</div>
        </div>
      </div>`;
    listarArchivos();
  }

  function listarArchivos() {
    fetch(`${API_URL}?accion=listarFiles&urlCarpeta=${usuarioActual.carpetaDrive}`)
      .then(r => r.json()).then(res => {
        document.getElementById('listaArchivos').innerHTML = res.archivos.map(f => `<div class="file-item"><span>${f.nombre}</span><div><a href="${f.url}" target="_blank">Ver</a> | <button onclick="eliminarArchivo('${f.id}')">Eliminar</button></div></div>`).join('');
      });
  }

  function eliminarArchivo(id) { if(confirm("¿Eliminar?")) fetch(API_URL, { method: 'POST', body: JSON.stringify({ accion: 'eliminar', id: id }) }).then(() => listarArchivos()); }
  function subirArchivo() { const f = document.getElementById('inputArchivo').files[0]; const r = new FileReader(); r.onload = (e) => { fetch(API_URL, { method: 'POST', body: JSON.stringify({ base64: e.target.result.split(',')[1], nombre: usuarioActual.nombre + "_" + document.getElementById('tipoArchivo').value, mimeType: f.type, idCarpeta: usuarioActual.carpetaDrive }) }).then(() => { alert("Subido"); listarArchivos(); }); }; r.readAsDataURL(f); }
  function filtrarNombres() { const val = document.getElementById('selectA').value, divN = document.getElementById('grupoN'); if(val) { divN.classList.remove('hidden'); const filtrados = datosGlobales.filter(d => d.area === val && d.nombre); document.getElementById('selectN').innerHTML = '<option value="">Seleccione...</option>' + filtrados.map(d => `<option value="${d.nombre}">${d.nombre}</option>`).join(''); } else { divN.classList.add('hidden'); } }
</script>
</body>
</html>
