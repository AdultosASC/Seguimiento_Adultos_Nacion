<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dirección Nacional de Adultos</title>
  <style>
    body { font-family: sans-serif; background: #f8fafc; padding: 2rem; display: flex; justify-content: center; }
    .container { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
    .field-wrapper { margin-bottom: 1.5rem; }
    .hidden { display: none !important; }
    select, button { width: 100%; margin-top: 5px; padding: 12px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #6366f1; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:disabled { background: #cbd5e1; }
    
    .grid-reporte { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 20px; }
    .card-resaltada { background: #eef2ff; padding: 20px; border-radius: 8px; border-left: 4px solid #6366f1; margin-top: 25px; text-align: center; }
    .card-asesor { background: #f1f5f9; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid #e2e8f0; }
    
    .seccion-titulo { font-size: 1.2rem; font-weight: bold; margin-top: 30px; border-bottom: 2px solid #6366f1; padding-bottom: 5px; }
    .item-fila { display: flex; align-items: center; margin-top: 10px; gap: 10px; }
    .status { font-size: 1.2rem; }
  </style>
</head>
<body>

<div class="container" id="paginaFiltros">
  <h3>Dirección NNacional de Adultos</h3>
  <div class="field-wrapper">
    <label>Área Estratégica</label>
    <select id="selectA" onchange="filtrarNombres()"><option value="">Cargando...</option></select>
  </div>
  <div id="grupoN" class="field-wrapper hidden">
    <label>Nombre</label>
    <select id="selectN" onchange="document.getElementById('btnConsultar').disabled = false"><option value="">Seleccione...</option></select>
  </div>
  <button id="btnConsultar" disabled onclick="consultar()">Consultar</button>
</div>

<div class="container hidden" id="paginaReporte">
  <div id="areaAdmin" class="nav-buttons hidden">
    <button onclick="alert('Indiv')">Integrante</button>
    <button onclick="alert('General')">General</button>
    <button onclick="alert('Área')">Área</button>
  </div>
  <h3 id="nombreReporte"></h3>
  <div id="detalleReporte"></div>
  <button onclick="location.reload()">Volver</button>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbw4okkl5_lnmqxK6b2eFL1uG6f92_Fu8BHDun4tvGtrexAECEAdEk1Kf3P9AfL29EH4/exec";
  let datosGlobales = [];

  fetch(API_URL).then(res => res.json()).then(data => {
    datosGlobales = data;
    const areas = [...new Set(data.map(d => d.area).filter(a => a && a.trim() !== ""))];
    document.getElementById('selectA').innerHTML = '<option value="">Seleccione Área...</option>' + areas.map(a => `<option value="${a}">${a}</option>`).join('');
  });

  function filtrarNombres() {
    const areaVal = document.getElementById('selectA').value;
    const divN = document.getElementById('grupoN');
    if (areaVal) {
      divN.classList.remove('hidden');
      const filtrados = datosGlobales.filter(d => d.area === areaVal && d.nombre && d.nombre.trim() !== "");
      document.getElementById('selectN').innerHTML = '<option value="">Seleccione Nombre...</option>' + filtrados.map(d => `<option value="${d.nombre}">${d.nombre}</option>`).join('');
    } else { divN.classList.add('hidden'); }
  }

  function icon(val) { return (val === true || val === 'TRUE' || val == 1) ? '✅' : '❌'; }

  function consultar() {
    const u = datosGlobales.find(d => d.nombre === document.getElementById('selectN').value);
    if (!u) return;

    document.getElementById('paginaFiltros').classList.add('hidden');
    document.getElementById('paginaReporte').classList.remove('hidden');
    if (u.lider == true || u.lider == "TRUE" || u.lider == 1) document.getElementById('areaAdmin').classList.remove('hidden');

    let fechaInicio = new Date(u.fechaNombramiento);
    let fechaFin = new Date(fechaInicio);
    fechaFin.setMonth(fechaInicio.getMonth() + parseInt(u.duracionMeses || 0));
    
    let hoy = new Date();
    let años = fechaFin.getFullYear() - hoy.getFullYear();
    let meses = fechaFin.getMonth() - hoy.getMonth();
    let dias = fechaFin.getDate() - hoy.getDate();
    if (dias < 0) { meses--; dias += 30; }
    if (meses < 0) { años--; meses += 12; }
    let tiempoRestante = (fechaFin < hoy) ? "Expirado" : `${años} años, ${meses} meses y ${dias} días`;

    document.getElementById('nombreReporte').innerText = "Información General";
    document.getElementById('detalleReporte').innerHTML = `
      <div class="grid-reporte">
        <p><strong>Área:</strong><br>${u.area}</p><p><strong>Nombre:</strong><br>${u.nombre}</p>
        <p><strong>Cargo:</strong><br>${u.cargo}</p><p><strong>Metodología:</strong><br>${u.metodologia}</p>
        <p><strong>F. Nombramiento:</strong><br>${u.fechaNombramiento}</p><p><strong>F. Finalización:</strong><br>${fechaFin.toISOString().split('T')[0]}</p>
      </div>
      <div class="card-resaltada"><strong>Tiempo restante en el cargo:</strong><br>${tiempoRestante}</div>
      <div class="card-asesor"><strong>Asesor Personal:</strong> ${u.asesorPersonal}</div>
      
      <div class="seccion-titulo">Proceso de Formación Básica</div>
      <div class="item-fila"><span class="status">${icon(u.valoracionInicial)}</span> <strong>Valoración Inicial:</strong> ${u.fechaValoracionInicial || ''}</div>
      <div class="item-fila"><span class="status">${icon(u.desarrolloPPD)}</span> <strong>En desarrollo PPD</strong></div>
      <div class="item-fila"><span class="status">${icon(u.valoracionFinal)}</span> <strong>Valoración Final:</strong> ${u.fechaValoracionFinal || ''}</div>
      <div class="item-fila"><span class="status">${icon(u.gn)}</span> <strong>Gestor Nacional:</strong> ${u.gestorNacionalFecha || ''}</div>
    `;
  }
</script>
</body>
</html>
