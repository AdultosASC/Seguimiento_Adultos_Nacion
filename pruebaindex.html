<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dirección Nacional de Adultos</title>
  <style>
    :root { --primary: #4f46e5; --bg: #f8fafc; }
    body { font-family: sans-serif; background: var(--bg); padding: 1.5rem; }
    .container { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 650px; margin: auto; }
    .section-card { background: #fdfdfd; border: 1px solid #eef2ff; padding: 1.5rem; border-radius: 16px; margin-bottom: 1.5rem; }
    .seccion-titulo { color: var(--primary); font-weight: 800; text-transform: uppercase; margin-bottom: 1rem; border-left: 4px solid var(--primary); padding-left: 10px; }
    .hidden { display: none !important; }
    select, button, input { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: var(--primary); color: white; cursor: pointer; }
    .file-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>

<div class="container" id="paginaFiltros">
  <h2>Dirección Nacional de Adultos</h2>
  <select id="selectA" onchange="filtrarNombres()"><option value="">Cargando...</option></select>
  <div id="grupoN" class="hidden"><select id="selectN" onchange="document.getElementById('btnConsultar').disabled = false"></select></div>
  <button id="btnConsultar" disabled onclick="consultar()">Consultar Datos</button>
</div>

<div class="container hidden" id="paginaReporte">
  <div id="detalleReporte"></div>
  
  <div class="section-card">
    <div class="seccion-titulo">Gestión de Archivos</div>
    <select id="tipoArchivo">
      <option value="Resolución nombramiento">Resolución nombramiento</option>
      <option value="Acuerdo mutuo">Acuerdo mutuo</option>
      <option value="Aval AP">Aval AP</option>
      <option value="Curso SfH1">Curso SfH1</option>
      <option value="Curso SfH2">Curso SfH2</option>
      <option value="Módulo de inducción">Módulo de inducción</option>
    </select>
    <input type="file" id="inputArchivo">
    <button onclick="procesarSubida()">Subir Archivo</button>
    <div id="listaArchivos" style="margin-top:15px"></div>
  </div>
  
  <button onclick="location.reload()" style="background:#64748b">Volver</button>
</div>

<script>
  const API_URL = " 
https://script.google.com/macros/s/AKfycbw4okkl5_lnmqxK6b2eFL1uG6f92_Fu8BHDun4tvGtrexAECEAdEk1Kf3P9AfL29EH4/exec"; // ACTUALIZA TU URL AQUÍ
  let datosGlobales = []; let usuarioActual = {};

  fetch(API_URL).then(res => res.json()).then(data => { datosGlobales = data; /*...carga selectA...*/ });

  function listarArchivos() {
    fetch(`${API_URL}?accion=listarFiles&urlCarpeta=${usuarioActual.carpetaDrive}`)
      .then(r => r.json()).then(res => {
        document.getElementById('listaArchivos').innerHTML = res.archivos.map(f => 
          `<div class="file-item">${f.nombre} <a href="${f.url}" target="_blank">Ver</a></div>`).join('');
      });
  }

  function procesarSubida() {
    const file = document.getElementById('inputArchivo').files[0];
    const reader = new FileReader();
    reader.onload = (e) => {
      google.script.run.withSuccessHandler(() => { alert("Subido"); listarArchivos(); })
        .subirArchivo(e.target.result, document.getElementById('tipoArchivo').value, usuarioActual.carpetaDrive);
    };
    reader.readAsDataURL(file);
  }

  function consultar() {
    usuarioActual = datosGlobales.find(d => d.nombre === document.getElementById('selectN').value);
    /* ... resto de lógica de secciones 1, 2 y 3 ... */
    listarArchivos();
  }
</script>
</body>
</html>
