<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dirección Nacional de Adultos</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; padding: 1.5rem; }
    .container { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 650px; margin: auto; }
    .hidden { display: none !important; }
    select, button, input { width: 100%; padding: 12px; margin-top: 8px; border-radius: 10px; border: 1px solid #e2e8f0; }
    button { background: #4f46e5; color: white; border: none; cursor: pointer; font-weight: 600; }
    
    .nav-buttons { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
    .nav-buttons button { width: auto; padding: 8px 16px; font-size: 0.85rem; background: #e0e7ff; color: #4f46e5; }
    .section-card { background: #fff; border: 1px solid #e2e8f0; padding: 1.5rem; border-radius: 16px; margin-bottom: 1.5rem; }
    .seccion-titulo { color: #4f46e5; font-weight: 800; text-transform: uppercase; margin-bottom: 1rem; border-left: 4px solid #4f46e5; padding-left: 10px; }
    
    .file-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #f1f5f9; }
    .btn-icon { width: 30px; height: 30px; padding: 4px; cursor: pointer; border: none; background: none; }
    
    .grid-reporte { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; align-items: center; }
    .card-resaltada { background: #4f46e5; color: white; padding: 1.2rem; border-radius: 12px; text-align: center; margin: 1rem 0; }
  </style>
</head>
<body>

<div class="container" id="paginaFiltros">
  <h2 style="text-align:center">Dirección Nacional de Adultos en el Movimiento</h2>
  <div class="field-wrapper"><label>Área Estratégica</label><select id="selectA" onchange="filtrarNombres()"><option value="">Cargando...</option></select></div>
  <div id="grupoN" class="hidden"><label>Nombre</label><select id="selectN" onchange="document.getElementById('btnConsultar').disabled = false"><option value="">Seleccione...</option></select></div>
  <button id="btnConsultar" disabled onclick="consultar()">Consultar Datos</button>
</div>

<div class="container hidden" id="paginaReporte">
  <div id="areaAdmin" class="nav-buttons hidden">
    <button onclick="alert('Información Personal')">Información Personal</button>
    <button onclick="alert('General')">General</button>
    <button onclick="alert('Área')">Área</button>
  </div>
  
  <div id="detalleReporte"></div>
  
  <div class="section-card">
    <div class="seccion-titulo">Documentos cargados</div>
    <div id="listaArchivos"></div>
    <hr style="border:0; border-top:1px solid #eee; margin:20px 0;">
    <div class="seccion-titulo">Cargar nuevo</div>
    <select id="tipoArchivo">
      <option value="Resolución nombramiento">Resolución nombramiento</option>
      <option value="Acuerdo mutuo">Acuerdo mutuo</option>
      <option value="Aval AP">Aval AP</option>
      <option value="Curso SfH1">Curso SfH1</option>
      <option value="Curso SfH2">Curso SfH2</option>
      <option value="Módulo de inducción">Módulo de inducción</option>
    </select>
    <input type="file" id="inputArchivo">
    <button onclick="subirArchivo()">Subir Archivo</button>
  </div>
  <button onclick="location.reload()" style="background:#64748b">Volver al inicio</button>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbw4okkl5_lnmqxK6b2eFL1uG6f92_Fu8BHDun4tvGtrexAECEAdEk1Kf3P9AfL29EH4/exec";
  let datosGlobales = [], usuarioActual = {};

  fetch(API_URL).then(res => res.json()).then(data => {
    datosGlobales = data;
    const areas = [...new Set(data.map(d => d.area).filter(a => a && a.trim() !== ""))];
    document.getElementById('selectA').innerHTML = '<option value="">Seleccione Área...</option>' + areas.map(a => `<option value="${a}">${a}</option>`).join('');
  });

  function getIcon(v) { return (v == true || v == 'TRUE' || v == 1) ? '<svg width="20" fill="green" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>' : '<svg width="20" fill="red" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>'; }

  function consultar() {
    usuarioActual = datosGlobales.find(d => d.nombre === document.getElementById('selectN').value);
    document.getElementById('paginaFiltros').classList.add('hidden');
    document.getElementById('paginaReporte').classList.remove('hidden');
    
    // Lógica para mostrar/ocultar botones de Lider
    if (usuarioActual.lider == true || usuarioActual.lider == "TRUE" || usuarioActual.lider == 1) {
      document.getElementById('areaAdmin').classList.remove('hidden');
    } else {
      document.getElementById('areaAdmin').classList.add('hidden');
    }
    
    let hoy = new Date(), fN = new Date(usuarioActual.fechaNombramiento), fFin = new Date(fN);
    fFin.setMonth(fN.getMonth() + parseInt(usuarioActual.duracionMeses || 0));
    let y = fFin.getFullYear() - hoy.getFullYear(), m = fFin.getMonth() - hoy.getMonth(), d = fFin.getDate() - hoy.getDate();
    if(d < 0) { m--; d += 30; } if(m < 0) { y--; m += 12; }
    let resto = (fFin < hoy) ? "Expirado" : `${y} años, ${m} meses y ${d} días`;

    document.getElementById('detalleReporte').innerHTML = `
      <div class="section-card">
        <div class="seccion-titulo">INFORMACIÓN GENERAL</div>
        <p><strong>${usuarioActual.nombre}</strong></p>
        <div class="grid-reporte">
          <p><strong>Área:</strong><br>${usuarioActual.area}</p><p><strong>Cargo:</strong><br>${usuarioActual.cargo}</p>
          <p><strong>Nombramiento:</strong><br>${usuarioActual.nombramiento}</p><p><strong>Metodología:</strong><br>${usuarioActual.metodologia}</p>
          <p><strong>Fecha de nombramiento:</strong><br>${usuarioActual.fechaNombramiento}</p><p><strong>Duración (meses):</strong><br>${usuarioActual.duracionMeses}</p>
          <p><strong>Fecha de finalización:</strong><br>${fFin.toISOString().split('T')[0]}</p>
        </div>
        <div class="card-resaltada">Tiempo restante en el cargo: ${resto}</div>
      </div>
      <div class="section-card">
        <div class="seccion-titulo">Proceso de Formación Básica</div>
        <div class="form-grid">
          <div>${getIcon(usuarioActual.valoracionInicial)} Valoración Inicial</div><div>Fecha: ${usuarioActual.fechaValoracionInicial || '--'}</div>
          <div>${getIcon(usuarioActual.desarrolloPPD)} En desarrollo PPD</div><div></div>
          <div>${getIcon(usuarioActual.valoracionFinal)} Valoración Final</div><div>Fecha: ${usuarioActual.fechaValoracionFinal || '--'}</div>
          <div>${getIcon(usuarioActual.gn)} Gestor Nacional</div><div>Fecha: ${usuarioActual.gestorNacionalFecha || '--'}</div>
        </div>
      </div>
      <div class="section-card">
        <div class="seccion-titulo">Perfeccionamiento Continuo</div>
        <div class="form-grid">
          <div>${getIcon(usuarioActual.pcValoracionInicial)} Valoración Inicial</div><div>Fecha: ${usuarioActual.pcFechaValoracionInicial || '--'}</div>
          <div>${getIcon(usuarioActual.pcDesarrolloPPD)} En desarrollo PPD</div><div></div>
          <div>${getIcon(usuarioActual.pcValoracionFinal)} Valoración Final</div><div>Fecha: ${usuarioActual.pcFechaValoracionFinal || '--'}</div>
          <div>${getIcon(usuarioActual.aaa)} AAA</div><div>Fecha: ${usuarioActual.aaaFecha || '--'}</div>
        </div>
      </div>`;
    listarArchivos();
  }

  function listarArchivos() {
    fetch(`${API_URL}?accion=listarFiles&urlCarpeta=${usuarioActual.carpetaDrive}`)
      .then(r => r.json()).then(res => {
        document.getElementById('listaArchivos').innerHTML = res.archivos.map(f => `
          <div class="file-item"><span>${f.nombre}</span><div>
            <a href="${f.url}" target="_blank" class="btn-icon"><svg width="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg></a>
            <button class="btn-icon" onclick="eliminarArchivo('${f.id}')"><svg width="20" viewBox="0 0 24 24" fill="red"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
          </div></div>`).join('');
      });
  }

  function eliminarArchivo(id) { if(confirm("¿Eliminar?")) fetch(API_URL, { method: 'POST', body: JSON.stringify({ accion: 'eliminar', id: id }) }).then(() => listarArchivos()); }
  function subirArchivo() { const f = document.getElementById('inputArchivo').files[0]; const r = new FileReader(); r.onload = (e) => { fetch(API_URL, { method: 'POST', body: JSON.stringify({ base64: e.target.result.split(',')[1], nombre: usuarioActual.nombre + "_" + document.getElementById('tipoArchivo').value, mimeType: f.type, idCarpeta: usuarioActual.carpetaDrive }) }).then(() => { alert("Subido"); listarArchivos(); }); }; r.readAsDataURL(f); }
  function filtrarNombres() { const val = document.getElementById('selectA').value, divN = document.getElementById('grupoN'); if(val) { divN.classList.remove('hidden'); const filtrados = datosGlobales.filter(d => d.area === val && d.nombre); document.getElementById('selectN').innerHTML = '<option value="">Seleccione Nombre...</option>' + filtrados.map(d => `<option value="${d.nombre}">${d.nombre}</option>`).join(''); } else { divN.classList.add('hidden'); } }
</script>
</body>
</html>
