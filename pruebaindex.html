<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dirección Nacional de Adultos</title>
  <style>
    body { font-family: sans-serif; background: #f8fafc; padding: 1.5rem; display: flex; justify-content: center; }
    .container { background: white; padding: 2.5rem; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
    .field-wrapper { margin-bottom: 1.5rem; }
    .hidden { display: none !important; }
    select, button, input { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #6366f1; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:disabled { background: #cbd5e1; }
    .grid-reporte { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 20px; }
    .card-resaltada { background: #eef2ff; padding: 20px; border-radius: 8px; border-left: 4px solid #6366f1; margin-top: 25px; text-align: center; }
    .card-asesor { background: #f1f5f9; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid #e2e8f0; }
    .seccion-titulo { font-size: 1.2rem; font-weight: bold; margin-top: 30px; border-bottom: 2px solid #6366f1; padding-bottom: 5px; margin-bottom: 15px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 10px; margin-bottom: 10px; }
    .file-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>

<div class="container" id="paginaFiltros">
  <h3>Dirección NNacional de Adultos</h3>
  <div class="field-wrapper">
    <label>Área Estratégica</label>
    <select id="selectA" onchange="filtrarNombres()"><option value="">Cargando...</option></select>
  </div>
  <div id="grupoN" class="field-wrapper hidden">
    <label>Nombre</label>
    <select id="selectN" onchange="document.getElementById('btnConsultar').disabled = false"><option value="">Seleccione...</option></select>
  </div>
  <button id="btnConsultar" disabled onclick="consultar()">Consultar</button>
</div>

<div class="container hidden" id="paginaReporte">
  <div id="areaAdmin" class="hidden" style="display:flex; gap:10px; margin-bottom:1rem;">
    <button>Integrante</button><button>General</button><button>Área</button>
  </div>
  <h3 id="nombreReporte"></h3>
  <div id="detalleReporte"></div>
  
  <div class="section-card">
    <div class="seccion-titulo">Documentos cargados en tu carpeta</div>
    <div id="listaArchivos"></div>
    <div class="seccion-titulo">Cargar nuevo documento</div>
    <select id="tipoArchivo">
      <option value="Resolución nombramiento">Resolución nombramiento</option>
      <option value="Acuerdo mutuo">Acuerdo mutuo</option>
      <option value="Aval AP">Aval AP</option>
      <option value="Curso SfH1">Curso SfH1</option>
      <option value="Curso SfH2">Curso SfH2</option>
      <option value="Módulo de inducción">Módulo de inducción</option>
    </select>
    <input type="file" id="inputArchivo">
    <button onclick="subirArchivo()">Subir Archivo</button>
  </div>
  <button onclick="location.reload()">Volver al inicio</button>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbw4okkl5_lnmqxK6b2eFL1uG6f92_Fu8BHDun4tvGtrexAECEAdEk1Kf3P9AfL29EH4/exec";
  let datosGlobales = [], usuarioActual = {};

  fetch(API_URL).then(res => res.json()).then(data => {
    datosGlobales = data;
    const areas = [...new Set(data.map(d => d.area).filter(a => a && a.trim() !== ""))];
    document.getElementById('selectA').innerHTML = '<option value="">Seleccione Área...</option>' + areas.map(a => `<option value="${a}">${a}</option>`).join('');
  });

  function getIcon(v) { 
    return (v == true || v == 'TRUE' || v == 1) ? '✅' : '❌'; 
  }

  function listarArchivos() {
    fetch(`${API_URL}?accion=listarFiles&urlCarpeta=${usuarioActual.carpetaDrive}`)
      .then(r => r.json()).then(res => {
        document.getElementById('listaArchivos').innerHTML = res.archivos.map(f => `
          <div class="file-item">
            <span>${f.nombre}</span>
            <div><a href="${f.url}" target="_blank">Ver</a> | <button onclick="eliminarArchivo('${f.id}')">Eliminar</button></div>
          </div>`).join('');
      });
  }

  function eliminarArchivo(id) {
    if(!confirm("¿Eliminar este archivo?")) return;
    fetch(API_URL, { method: 'POST', body: JSON.stringify({ accion: 'eliminar', id: id }) })
      .then(() => listarArchivos());
  }

  function subirArchivo() {
    const f = document.getElementById('inputArchivo').files[0];
    const r = new FileReader();
    r.onload = (e) => {
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ base64: e.target.result.split(',')[1], nombre: usuarioActual.nombre + "_" + document.getElementById('tipoArchivo').value, mimeType: f.type, idCarpeta: usuarioActual.carpetaDrive }) })
        .then(() => { alert("Archivo subido"); listarArchivos(); });
    };
    r.readAsDataURL(f);
  }

  function consultar() {
    usuarioActual = datosGlobales.find(d => d.nombre === document.getElementById('selectN').value);
    document.getElementById('paginaFiltros').classList.add('hidden');
    document.getElementById('paginaReporte').classList.remove('hidden');
    
    let hoy = new Date(), fN = new Date(usuarioActual.fechaNombramiento), fFin = new Date(fN);
    fFin.setMonth(fN.getMonth() + parseInt(usuarioActual.duracionMeses || 0));
    let y = fFin.getFullYear() - hoy.getFullYear(), m = fFin.getMonth() - hoy.getMonth(), d = fFin.getDate() - hoy.getDate();
    if(d < 0) { m--; d += 30; } if(m < 0) { y--; m += 12; }
    let resto = (fFin < hoy) ? "Expirado" : `${y} años, ${m} meses y ${d} días`;

    document.getElementById('detalleReporte').innerHTML = `
      <div class="grid-reporte">
        <p><strong>Área Estratégica:</strong><br>${usuarioActual.area}</p><p><strong>Nombre:</strong><br>${usuarioActual.nombre}</p>
        <p><strong>Cargo:</strong><br>${usuarioActual.cargo}</p><p><strong>Metodología:</strong><br>${usuarioActual.metodologia}</p>
        <p><strong>Fecha Nombramiento:</strong><br>${usuarioActual.fechaNombramiento}</p><p><strong>Fecha Finalización:</strong><br>${fFin.toISOString().split('T')[0]}</p>
      </div>
      <div class="card-resaltada"><strong>Tiempo restante en el cargo:</strong><br>${resto}</div>
      <div class="card-asesor"><strong>Asesor Personal:</strong> ${usuarioActual.asesorPersonal}</div>
      <div class="seccion-titulo">Proceso de Formación Básica</div>
      <div class="form-grid">
        <div>${getIcon(usuarioActual.valoracionInicial)} <strong>Valoración Inicial</strong></div><div>Fecha: ${usuarioActual.fechaValoracionInicial || ''}</div>
        <div>${getIcon(usuarioActual.desarrolloPPD)} <strong>En desarrollo PPD</strong></div><div></div>
        <div>${getIcon(usuarioActual.valoracionFinal)} <strong>Valoración Final</strong></div><div>Fecha: ${usuarioActual.fechaValoracionFinal || ''}</div>
        <div>${getIcon(usuarioActual.gn)} <strong>Gestor Nacional</strong></div><div>Fecha: ${usuarioActual.gestorNacionalFecha || ''}</div>
      </div>
    `;
    listarArchivos();
  }

  function filtrarNombres() {
    const areaVal = document.getElementById('selectA').value;
    const divN = document.getElementById('grupoN');
    if (areaVal) {
      divN.classList.remove('hidden');
      const filtrados = datosGlobales.filter(d => d.area === areaVal && d.nombre);
      document.getElementById('selectN').innerHTML = '<option value="">Seleccione Nombre...</option>' + filtrados.map(d => `<option value="${d.nombre}">${d.nombre}</option>`).join('');
    } else { divN.classList.add('hidden'); }
  }
</script>
</body>
</html>
