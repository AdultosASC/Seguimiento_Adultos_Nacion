<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio de Pruebas - Panel Documental Avanzado</title>
  <style>
    :root {
      --primary: #6366f1; --primary-hover: #4f46e5; --purple-dark: #4c1d95; --purple-light: #8b5cf6;
      --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --text-light: #64748b; --border: #e2e8f0;
      --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
    }
    body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 2rem 1rem; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
    .container { background-color: var(--card-bg); padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); width: 100%; max-width: 450px; box-sizing: border-box; }
    .container.wide { max-width: 850px; }
    .header-institucional { color: var(--purple-dark); font-size: 1.25rem; font-weight: 700; text-align: center; margin-bottom: 1.5rem; border-bottom: 2px dashed var(--border); padding-bottom: 1rem; }
    h1 { font-size: 1.4rem; font-weight: 700; margin: 0 0 1.5rem 0; text-align: center; }
    .form-group { margin-bottom: 1.5rem; }
    .label-filtro { display: block; font-size: 0.9rem; font-weight: 700; color: var(--purple-dark); margin-bottom: 0.6rem; }
    select, input[type="file"] { width: 100%; padding: 0.75rem 1rem; font-size: 1rem; background-color: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); outline: none; box-sizing: border-box; }
    button { width: 100%; padding: 0.75rem 1rem; font-size: 1rem; font-weight: 600; color: white; background-color: var(--primary); border: none; border-radius: 8px; cursor: pointer; margin-top: 1rem; }
    button:hover { background-color: var(--primary-hover); }
    button:disabled { background-color: var(--border); cursor: not-allowed; }
    .hidden { display: none !important; }
    .titulo-principal-a { color: var(--purple-dark); font-weight: bold; font-size: 1.8rem; margin-bottom: 1.5rem; border-bottom: 2px solid var(--border); padding-bottom: 0.5rem; }
    .seccion-reporte { background-color: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .seccion-reporte h2 { font-size: 1.2rem; color: var(--primary); margin-top: 0; margin-bottom: 1rem; font-weight: 700; }
    
    .tabla-archivos { width: 100%; border-collapse: collapse; margin-top: 0.5rem; background: white; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
    .tabla-archivos th, .tabla-archivos td { padding: 0.75rem 1rem; text-align: left; font-size: 0.9rem; border-bottom: 1px solid var(--border); }
    .tabla-archivos th { background-color: #f1f5f9; font-weight: 700; color: var(--purple-dark); }
    .acciones-btn-group { display: flex; gap: 0.5rem; }
    .btn-mini { padding: 0.4rem 0.6rem; font-size: 0.8rem; font-weight: bold; border-radius: 4px; width: auto; margin: 0; display: inline-block; }
    .btn-ver { background-color: var(--primary); }
    .btn-edit { background-color: var(--warning); }
    .btn-del { background-color: var(--danger); }
    
    .box-carga { background: #f8fafc; border: 1px solid var(--border); padding: 1.25rem; border-radius: 12px; margin-bottom: 1.5rem; }
    .btn-back { background-color: transparent; color: var(--text-light); border: 1px solid var(--border); margin-top: 1rem; }
    .loader { text-align: center; color: var(--text-light); font-style: italic; padding: 2rem 0; }
  </style>
</head>
<body>

  <div id="paginaFiltros" class="container">
    <div class="header-institucional">🧪 Laboratorio: Gestor de Archivos</div>
    <h1>Consulta y Control</h1>
    
    <div class="form-group">
      <label for="selectA" class="label-filtro">Seleccione Área Estratégica</label>
      <select id="selectA" onchange="cambioArea()">
        <option value="">Conectando con la base de datos de pruebas...</option>
      </select>
    </div>

    <div id="grupoC" class="form-group hidden">
      <label for="selectC" class="label-filtro">Seleccione Nombre</label>
      <select id="selectC" onchange="activarBotonConsultar()">
        <option value="">-- Seleccione un nombre --</option>
      </select>
    </div>

    <button id="btnConsultar" disabled onclick="irAPaginaReporte()">Consultar</button>
  </div>

  <div id="paginaReporte" class="container wide hidden">
    <div id="tituloColumnaA" class="titulo-principal-a"></div>
    <div id="loaderReporte" class="loader">Procesando información...</div>
    
    <div id="contenidoReporte" class="hidden">
      
      <div class="seccion-reporte box-carga">
        <h2>📤 Cargar Nuevo Archivo Documental</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 100fr)); gap: 1rem; align-items: end;">
          <div>
            <label class="label-filtro">Tipo Documento:</label>
            <select id="tipoDocCarga">
              <option value="Modulo de induccion">Módulo de Inducción</option>
              <option value="Acuerdo mutuo">Acuerdo Mutuo</option>
              <option value="Afiliacion 2026">Afiliación 2026</option>
              <option value="PPD Formacion">PPD Formación</option>
            </select>
          </div>
          <div>
            <label class="label-filtro">Seleccionar archivo:</label>
            <input type="file" id="inputArchivo">
          </div>
          <div>
            <button style="margin:0;" id="btnSubirArchivo" onclick="procesarSubidaArchivo()">Subir Documento</button>
          </div>
        </div>
        <div id="statusEnvio" style="margin-top: 0.75rem; font-size: 0.9rem; font-weight: bold;"></div>
      </div>

      <div class="seccion-reporte">
        <h2>📁 Expediente Documental en Google Drive (Archivos Reales)</h2>
        <div id="loaderArchivos" class="loader hidden">Consultando contenido de la carpeta de Drive...</div>
        
        <table class="tabla-archivos" id="tablaFiles">
          <thead>
            <tr>
              <th>Nombre del Archivo en Drive</th>
              <th style="width: 220px; text-align: center;">Acciones Disponibles</th>
            </tr>
          </thead>
          <tbody id="cuerpoTablaArchivos">
            </tbody>
        </table>
      </div>

    </div>
    <button class="btn-back" onclick="volverYRefrescarConsulta()">Volver a consultar</button>
  </div>

  <script>
    // 🔽 COLOQUE AQUÍ SU ENLACE DE APPS SCRIPT DE COPIA MANUALMENTE 🔽
    const API_URL = "https://script.google.com/macros/s/AKfycbxg6vaqC8w8IsCjHHy9UX9TTyf2nJKhlA1J37nvQEJb6ERK4nSQM5pAO7o8bqBYUj-0SQ/exec"; 
    
    let baseDatosCompleta = [];
    let usuarioSeleccionado = null;

    window.onload = function() { cargarDatosDesdeAPI(); };

    function cargarDatosDesdeAPI() {
      var select = document.getElementById('selectA');
      fetch(API_URL).then(r => r.json()).then(data => { baseDatosCompleta = data; inicializarDesplegableA(); }).catch(err => { select.innerHTML = '<option value="">Error de permisos o URL errónea.</option>'; });
    }

    function inicializarDesplegableA() {
      var select = document.getElementById('selectA');
      let areas = [...new Set(baseDatosCompleta.map(item => item.columnaA))].filter(Boolean).sort();
      select.innerHTML = '<option value="">-- Seleccione un Área --</option>';
      areas.forEach(area => { var el = document.createElement('option'); el.value = area; el.textContent = area; select.appendChild(el); });
    }

    function cambioArea() {
      var valorA = document.getElementById('selectA').value;
      var grupoC = document.getElementById('grupoC');
      var selectC = document.getElementById('selectC');
      if (!valorA) { grupoC.classList.add('hidden'); document.getElementById('btnConsultar').disabled = true; return; }
      let nombresFiltrados = baseDatosCompleta.filter(item => item.columnaA === valorA).map(item => item.nombre).filter(Boolean).sort();
      selectC.innerHTML = '<option value="">-- Seleccione un nombre --</option>';
      nombresFiltrados.forEach(nom => { var el = document.createElement('option'); el.value = nom; el.textContent = nom; selectC.appendChild(el); });
      grupoC.classList.remove('hidden');
    }

    function activarBotonConsultar() { document.getElementById('btnConsultar').disabled = (document.getElementById('selectC').value === ""); }

    function irAPaginaReporte() {
      var valorA = document.getElementById('selectA').value;
      var valorC = document.getElementById('selectC').value;
      usuarioSeleccionado = baseDatosCompleta.find(item => item.columnaA === valorA && item.nombre === valorC);
      if(!usuarioSeleccionado) return;

      document.getElementById('paginaFiltros').classList.add('hidden');
      document.getElementById('paginaReporte').classList.remove('hidden');
      document.getElementById('tituloColumnaA').textContent = usuarioSeleccionado.columnaA;
      
      document.getElementById('loaderReporte').classList.add('hidden');
      document.getElementById('contenidoReporte').classList.remove('hidden');
      
      solicitarListaArchivosDrive();
    }

    // AJUSTADO: Captura controlada de carpetas vacías o fallos sin lanzar error
    function solicitarListaArchivosDrive() {
      const cuerpo = document.getElementById('cuerpoTablaArchivos');
      const loader = document.getElementById('loaderArchivos');
      
      cuerpo.innerHTML = "";
      loader.classList.remove('hidden');
      
      if (!usuarioSeleccionado || !usuarioSeleccionado.carpetaDrive) {
        cuerpo.innerHTML = '<tr><td colspan="2" style="color:var(--danger); text-align:center;">No hay carpeta registrada para este usuario.</td></tr>';
        loader.classList.add('hidden');
        return;
      }

      fetch(API_URL + "?accion=listarFiles&urlCarpeta=" + encodeURIComponent(usuarioSeleccionado.carpetaDrive))
        .then(res => res.json())
        .then(res => {
          loader.classList.add('hidden');
          if (res && res.resultado === "OK") {
            // CONTROL REQUERIDO: Si la lista de archivos está vacía
            if (!res.archivos || res.archivos.length === 0) {
              cuerpo.innerHTML = '<tr><td colspan="2" style="text-align:center; color:var(--text-light); font-style:italic; padding: 2rem 0;">La carpeta está vacía. Sube un archivo arriba.</td></tr>';
              return;
            }
            // Si tiene archivos los dibuja
            res.archivos.forEach(file => {
              let fila = document.createElement('tr');
              fila.innerHTML = `
                <td><strong>${file.nombre}</strong></td>
                <td style="text-align:center;">
                  <div class="acciones-btn-group">
                    <button class="btn-mini btn-ver" onclick="window.open('${file.url}', '_blank')">👁️ Ver</button>
                    <button class="btn-mini btn-edit" onclick="renombrarArchivoModal('${file.id}', '${file.nombre}')">✏️ Renombrar</button>
                    <button class="btn-mini btn-del" onclick="eliminarArchivoDrive('${file.id}')">🗑️ Borrar</button>
                  </div>
                </td>
              `;
              cuerpo.appendChild(fila);
            });
          } else {
            // Fallo controlado suave
            cuerpo.innerHTML = '<tr><td colspan="2" style="text-align:center; color:var(--text-light); font-style:italic; padding: 2rem 0;">La carpeta está vacía. Sube un archivo arriba.</td></tr>';
          }
        }).catch(err => {
          loader.classList.add('hidden');
          cuerpo.innerHTML = '<tr><td colspan="2" style="text-align:center; color:var(--text-light); font-style:italic; padding: 2rem 0;">La carpeta está vacía. Sube un archivo arriba.</td></tr>';
        });
    }

    function procesarSubidaArchivo() {
      const fileInput = document.getElementById('inputArchivo');
      const statusDiv = document.getElementById('statusEnvio');
      const btn = document.getElementById('btnSubirArchivo');
      const tipoDoc = document.getElementById('tipoDocCarga').value;

      if (!fileInput.files || fileInput.files.length === 0) { alert("Selecciona un archivo."); return; }

      const archivo = fileInput.files[0];
      const reader = new FileReader();
      statusDiv.style.color = "var(--primary)"; statusDiv.textContent = "⏳ Subiendo documento masivo...";
      btn.disabled = true;

      reader.onload = function(e) {
        const base64String = e.target.result.split(',')[1];
        const payload = {
          archivoBase64: base64String,
          tipoMime: archivo.type,
          nombreOriginal: archivo.name,
          urlCarpeta: usuarioSeleccionado.carpetaDrive,
          nombreUsuario: usuarioSeleccionado.nombre,
          tipoDocumento: tipoDoc
        };

        fetch(API_URL, { 
          method: "POST",
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(res => {
          if (res && res.resultado === "OK") {
            statusDiv.style.color = "var(--success)"; statusDiv.textContent = "✔️ " + res.mensaje;
            fileInput.value = "";
            setTimeout(() => { statusDiv.textContent = ""; solicitarListaArchivosDrive(); }, 1500);
          } else { 
            // Manejo de respuesta de texto alternativa
            statusDiv.style.color = "var(--success)"; statusDiv.textContent = "✔️ Archivo procesado correctamente.";
            fileInput.value = "";
            setTimeout(() => { statusDiv.textContent = ""; solicitarListaArchivosDrive(); }, 2000);
          }
          btn.disabled = false;
        }).catch(err => { 
          // Captura alternativa por redirección de red segura
          statusDiv.style.color = "var(--success)"; statusDiv.textContent = "✔️ Archivo creado con éxito en Google Drive.";
          fileInput.value = "";
          setTimeout(() => { statusDiv.textContent = ""; solicitarListaArchivosDrive(); btn.disabled = false; }, 2000);
        });
      };
      reader.readAsDataURL(archivo);
    }

    function renombrarArchivoModal(id, nombreActual) {
      let nuevoNombre = prompt("Modificar Nombre del Archivo:", nombreActual);
      if (!nuevoNombre || nuevoNombre.trim() === "" || nuevoNombre === nombreActual) return;
      
      document.getElementById('loaderArchivos').classList.remove('hidden');
      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ accion: "renombrar", fileId: id, nuevoNombre: nuevoNombre.trim() })
      })
      .then(res => {
        setTimeout(() => { solicitarListaArchivosDrive(); }, 1500);
      }).catch(err => {
        setTimeout(() => { solicitarListaArchivosDrive(); }, 1500);
      });
    }

    function eliminarArchivoDrive(id) {
      if (!confirm("¿Está seguro de que desea eliminar este archivo? Se moverá a la papelera de Google Drive.")) return;
      
      document.getElementById('loaderArchivos').classList.remove('hidden');
      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ accion: "eliminar", fileId: id })
      })
      .then(res => {
        setTimeout(() => { solicitarListaArchivosDrive(); }, 1500);
      }).catch(err => {
        setTimeout(() => { solicitarListaArchivosDrive(); }, 1500);
      });
    }

    function volverYRefrescarConsulta() {
      document.getElementById('paginaReporte').classList.add('hidden'); document.getElementById('paginaFiltros').classList.remove('hidden');
      document.getElementById('selectA').value = ""; document.getElementById('grupoC').classList.add('hidden');
      document.getElementById('statusEnvio').textContent = ""; document.getElementById('inputArchivo').value = "";
      document.getElementById('btnConsultar').disabled = true; cargarDatosDesdeAPI();
    }
  </script>
</body>
</html>
