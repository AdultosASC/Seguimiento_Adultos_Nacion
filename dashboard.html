<div class="container wide">
    <h1 class="titulo-principal-a">Resumen Dirección Nacional de Adultos</h1>
    
    <div class="form-group">
        <select id="filtroArea" onchange="renderDashboard()">
            <option value="GENERAL">--- Ver Resumen General ---</option>
            </select>
    </div>

    <div id="displayArea"></div>
</div>

<script>
    // Función para renderizar según la selección
    function renderDashboard() {
        const area = document.getElementById('filtroArea').value;
        const display = document.getElementById('displayArea');
        
        if (area === "GENERAL") {
            renderGeneral(baseDatosCompleta);
        } else {
            renderPorArea(baseDatosCompleta.filter(i => i.columnaA === area));
        }
    }

    function renderPorArea(data) {
        let html = `<h2>Miembros en el Área: ${data.length}</h2>`;
        html += `<table class="tabla-area"><thead><tr><th>Nombre</th><th>Cargo</th><th>FB: VI | PPD | VF | GN</th><th>PC: VI | PPD | VF | AAA</th></tr></thead><tbody>`;
        
        data.forEach(p => {
            html += `<tr>
                <td>${p.nombre}</td>
                <td>${p.cargo}</td>
                <td>${check(p.columnaL)} ${check(p.columnaN)} ${check(p.columnaO)} ${check(p.columnaQ)}</td>
                <td>${check(p.columnaS)} ${check(p.columnaU)} ${check(p.columnaV)} ${check(p.columnaX)}</td>
            </tr>`;
        });
        html += `</tbody></table>`;
        document.getElementById('displayArea').innerHTML = html;
    }

    // Utilidad para los iconos
    function check(val) {
        const isTrue = (val === true || val === "VERDADERO" || val === "true");
        return `<span class="badge" style="color:${isTrue ? 'var(--success)' : 'var(--danger)'}">${isTrue ? '✔️' : '❌'}</span>`;
    }

    function renderGeneral(data) {
        // Lógica para contar totales
        const total = data.length;
        const count = (col) => data.filter(i => i[col] === true || i[col] === "VERDADERO").length;
        
        document.getElementById('displayArea').innerHTML = `
            <div class="kpi-container">
                <div class="card-stats"><h3>Formación Básica</h3>
                VI: ${count('columnaL')} | PPD: ${count('columnaN')} | VF: ${count('columnaO')} | GN: ${count('columnaQ')}</div>
                <div class="card-stats"><h3>Perfeccionamiento Continuo</h3>
                VI: ${count('columnaS')} | PPD: ${count('columnaU')} | VF: ${count('columnaV')} | AAA: ${count('columnaX')}</div>
            </div>`;
    }
</script>
