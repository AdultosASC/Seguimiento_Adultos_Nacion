<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Dirección Nacional</title>
  <style>
    :root { --primary: #6366f1; --purple-dark: #4c1d95; --border: #e2e8f0; --bg: #f8fafc; --success: #10b981; --danger: #ef4444; }
    body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); padding: 2rem 1rem; color: #1e293b; }
    .container { max-width: 1100px; margin: auto; background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 2rem; }
    .btn-tab { padding: 0.75rem 1.5rem; border: 1px solid var(--primary); background: transparent; color: var(--primary); border-radius: 8px; cursor: pointer; font-weight: bold; }
    .btn-tab.active { background: var(--primary); color: white; }
    .section-content { display: none; }
    .section-content.active { display: block; }
    .tabla-container { overflow-x: auto; margin-top: 1rem; }
    table { width: 100%; border-collapse: collapse; border: 1px solid var(--border); }
    th { background: #f1f5f9; padding: 10px; text-align: center; border: 1px solid var(--border); font-size: 0.85rem; }
    td { padding: 10px; border: 1px solid var(--border); text-align: center; font-size: 0.9rem; }
    .col-nombre { text-align: left !important; font-weight: 600; }
    .header-group { border-bottom: 2px solid var(--purple-dark); }
  </style>
</head>
<body>

<div class="container">
  <div class="nav-tabs">
    <button class="btn-tab active" onclick="showSection('general')">Información General</button>
    <button class="btn-tab" onclick="showSection('area')">Información por Área</button>
  </div>

  <div id="general" class="section-content active">
    <h2>Resumen Nacional</h2>
    <div id="statsGeneral">Cargando datos del servidor...</div>
  </div>

  <div id="area" class="section-content">
    <select id="selectArea" onchange="renderTablaArea()">
      <option value="">Seleccione un Área...</option>
    </select>
    <div id="tablaAreaContainer" class="tabla-container"></div>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxg6vaqC8w8IsCjHHy9UX9TTyf2nJKhlA1J37nvQEJb6ERK4nSQM5pAO7o8bqBYUj-0SQ/exec";
  let baseDatosCompleta = [];

  // Función para obtener datos de forma segura
  async function cargarDatos() {
    try {
      const response = await fetch(API_URL);
      if (!response.ok) throw new Error('Error en la conexión');
      baseDatosCompleta = await response.json();
      inicializarDashboard();
    } catch (err) {
      document.getElementById('statsGeneral').innerHTML = "No se pudieron cargar los datos. Verifica que el script de Google esté publicado como Web App con acceso 'Cualquiera'.";
      console.error(err);
    }
  }

  window.onload = cargarDatos;

  function showSection(id) {
    document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.btn-tab').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    event.target.classList.add('active');
  }

  function inicializarDashboard() {
    if (!baseDatosCompleta || baseDatosCompleta.length === 0) return;
    
    // Poblar select
    const areas = [...new Set(baseDatosCompleta.map(i => i.columnaA).filter(Boolean))].sort();
    const sel = document.getElementById('selectArea');
    areas.forEach(a => sel.innerHTML += `<option value="${a}">${a}</option>`);
    
    // Contar totales
    const count = (col) => baseDatosCompleta.filter(i => String(i[col]).toUpperCase() === "TRUE" || String(i[col]).toUpperCase() === "VERDADERO").length;
    
    document.getElementById('statsGeneral').innerHTML = `
      <h3>Formación Básica</h3>
      <p>VI: ${count('columnaL')} | PPD: ${count('columnaN')} | VF: ${count('columnaO')} | GN: ${count('columnaQ')}</p>
      <h3>Perfeccionamiento Continuo</h3>
      <p>VI: ${count('columnaS')} | PPD: ${count('columnaU')} | VF: ${count('columnaV')} | AAA: ${count('columnaX')}</p>
    `;
  }

  function renderTablaArea() {
    const area = document.getElementById('selectArea').value;
    const filtrados = baseDatosCompleta.filter(i => i.columnaA === area && i.nombre && i.nombre.trim() !== "");
    
    let html = `<table>
      <thead>
        <tr><th rowspan="2">Nombre</th><th rowspan="2">Cargo</th><th colspan="4" class="header-group">Formación Básica</th><th colspan="4" class="header-group">Perfeccionamiento Continuo</th></tr>
        <tr><th>VI</th><th>PPD</th><th>VF</th><th>GN</th><th>VI</th><th>PPD</th><th>VF</th><th>AAA</th></tr>
      </thead>
      <tbody>`;
    
    filtrados.forEach(p => {
      html += `<tr>
                <td class="col-nombre">${p.nombre}</td><td>${p.cargo}</td>
                <td>${check(p.columnaL)}</td><td>${check(p.columnaN)}</td><td>${check(p.columnaO)}</td><td>${check(p.columnaQ)}</td>
                <td>${check(p.columnaS)}</td><td>${check(p.columnaU)}</td><td>${check(p.columnaV)}</td><td>${check(p.columnaX)}</td>
               </tr>`;
    });
    document.getElementById('tablaAreaContainer').innerHTML = html + "</tbody></table>";
  }

  function check(v) { 
    return (String(v).toUpperCase() === "TRUE" || String(v).toUpperCase() === "VERDADERO") ? "✔️" : "❌"; 
  }
</script>
</body>
</html>
