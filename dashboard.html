<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generador de Informes - Dirección Nacional</title>
  <style>
    :root { --primary: #6366f1; --purple-dark: #4c1d95; --bg: #f8fafc; }
    body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .container { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    select { width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 1rem; }
    button { width: 100%; padding: 0.75rem; background: var(--purple-dark); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>

<div class="container">
  <h2>Generar Informe de Área</h2>
  <select id="selArea"><option value="">Cargando áreas...</option></select>
  <button onclick="generarInforme()">Generar e Imprimir Informe</button>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxg6vaqC8w8IsCjHHy9UX9TTyf2nJKhlA1J37nvQEJb6ERK4nSQM5pAO7o8bqBYUj-0SQ/exec";
  let db = [];

  window.onload = () => {
    fetch(API_URL).then(r => r.json()).then(data => {
      db = data;
      const areas = [...new Set(db.map(i => i.columnaA).filter(Boolean))].sort();
      const sel = document.getElementById('selArea');
      sel.innerHTML = '<option value="">-- Seleccione Área --</option>';
      areas.forEach(a => sel.innerHTML += `<option value="${a}">${a}</option>`);
    });
  };

  function generarInforme() {
    const area = document.getElementById('selArea').value;
    if (!area) return alert("Por favor seleccione un área");
    
    const filtrados = db.filter(i => i.columnaA === area && i.nombre);
    let win = window.open('', '_blank');
    let html = `<html><head><style>
      body{font-family:sans-serif; padding:20px;} 
      .tarjeta{border:1px solid #ccc; padding:15px; margin-bottom:20px; page-break-inside:avoid;}
      h3{margin-top:0;}
    </style></head><body><h1>Informe de Área: ${area}</h1>`;
    
    filtrados.forEach(u => {
      let fin = new Date(u.fechaFinalizacion);
      let hoy = new Date();
      let diff = Math.floor((fin - hoy) / (1000 * 60 * 60 * 24 * 30));
      
      html += `<div class="tarjeta">
        <h3>${u.nombre}</h3>
        <p><strong>Meses restantes en el cargo:</strong> ${diff > 0 ? diff : 0}</p>
        <p><strong>Formación Básica:</strong> Inicial(${u.valoracionInicial?'✅':'❌'}) PPD(${u.desarrolloPPD?'✅':'❌'}) Final(${u.valoracionFinal?'✅':'❌'}) Gestor(${u.gestorNacionalFecha?'✅':'❌'})</p>
        <p><strong>Perfeccionamiento:</strong> Inicial(${u.s4ValoracionInicial?'✅':'❌'}) PPD(${u.s4DesarrolloPPD?'✅':'❌'}) Final(${u.s4ValoracionFinal?'✅':'❌'}) AAA(${u.aaaFecha?'✅':'❌'})</p>
      </div>`;
    });
    
    html += "</body></html>";
    win.document.write(html);
    win.print();
  }
</script>
</body>
</html>
