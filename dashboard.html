<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dirección Nacional de Adultos</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root { --primary: #6366f1; --purple-dark: #4c1d95; --bg: #f8fafc; --text: #1e293b; --border: #e2e8f0; }
    body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); padding: 2rem; }
    .container { max-width: 900px; margin: auto; background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .hidden { display: none !important; }
    /* Estilos para el Informe Impreso/PDF */
    #reporteImpresion { width: 100%; font-size: 0.8rem; }
    #reporteImpresion table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    #reporteImpresion th, #reporteImpresion td { border: 1px solid #000; padding: 5px; text-align: center; }
    #reporteImpresion th { background: #eee; }
  </style>
</head>
<body>

<div id="paginaFiltros" class="container">
  <h1>Dirección Nacional de Adultos</h1>
  <select id="selectA" onchange="cambioArea()"><option value="">Cargando Áreas...</option></select>
  <div id="grupoC" class="hidden"><select id="selectC" onchange="activarBoton()"><option value="">Seleccione Nombre...</option></select></div>
  <div style="display: flex; gap: 10px;">
    <button id="btnConsultar" disabled onclick="irAPaginaReporte()">Consultar</button>
    <button style="background: var(--purple-dark);" onclick="prepararInforme()">Generar Informe</button>
  </div>
</div>

<div id="reporteImpresion" class="hidden"></div>

<div id="paginaReporte" class="container hidden">
    <button onclick="volver()">Volver</button>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxg6vaqC8w8IsCjHHy9UX9TTyf2nJKhlA1J37nvQEJb6ERK4nSQM5pAO7o8bqBYUj-0SQ/exec";
  let db = [];

  window.onload = () => { fetch(API_URL).then(r => r.json()).then(d => { db = d; inicializarA(); }); };

  function inicializarA() {
    let sel = document.getElementById('selectA');
    let areas = [...new Set(db.map(i => i.columnaA))].sort();
    sel.innerHTML = '<option value="">-- Seleccione Área --</option>';
    areas.forEach(a => sel.innerHTML += `<option value="${a}">${a}</option>`);
  }

  function cambioArea() {
    let selC = document.getElementById('selectC');
    let area = document.getElementById('selectA').value;
    selC.innerHTML = '<option value="">-- Seleccione Nombre --</option>';
    db.filter(i => i.columnaA === area).forEach(i => selC.innerHTML += `<option value="${i.nombre}">${i.nombre}</option>`);
    document.getElementById('grupoC').classList.remove('hidden');
  }

  function activarBoton() { document.getElementById('btnConsultar').disabled = false; }

  function prepararInforme() {
    const area = document.getElementById('selectA').value;
    if (!area) return alert("Seleccione un área primero");
    
    const filtrados = db.filter(i => i.columnaA === area);
    let html = `<h1>Informe de Área: ${area}</h1>
    <table border="1">
      <thead>
        <tr>
          <th>Nombre</th><th>Cargo</th><th>FB:VI</th><th>FB:PPD</th><th>FB:VF</th><th>FB:GN</th>
          <th>PC:VI</th><th>PC:PPD</th><th>PC:VF</th><th>PC:AAA</th>
        </tr>
      </thead>
      <tbody>`;
    
    filtrados.forEach(u => {
      html += `<tr>
        <td>${u.nombre}</td><td>${u.cargo}</td>
        <td>${u.valoracionInicial?'✅':'❌'}</td><td>${u.desarrolloPPD?'✅':'❌'}</td><td>${u.valoracionFinal?'✅':'❌'}</td><td>${u.gestorNacionalFecha?'✅':'❌'}</td>
        <td>${u.s4ValoracionInicial?'✅':'❌'}</td><td>${u.s4DesarrolloPPD?'✅':'❌'}</td><td>${u.s4ValoracionFinal?'✅':'❌'}</td><td>${u.aaaFecha?'✅':'❌'}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
    
    const contenedor = document.getElementById('reporteImpresion');
    contenedor.innerHTML = html;
    contenedor.classList.remove('hidden');
    
    // Descargar PDF automáticamente
    html2pdf().from(contenedor).save('Informe_'+area+'.pdf');
    contenedor.classList.add('hidden');
  }

  function volver() { document.getElementById('paginaReporte').classList.add('hidden'); document.getElementById('paginaFiltros').classList.remove('hidden'); }
  function irAPaginaReporte() { /* Tu lógica original de consulta individual */ }
</script>
</body>
</html>
