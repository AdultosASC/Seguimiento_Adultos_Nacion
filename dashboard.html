<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Dirección Nacional</title>
  <style>
    :root { --primary: #6366f1; --purple-dark: #4c1d95; --bg: #f8fafc; --success: #10b981; --danger: #ef4444; }
    body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); padding: 2rem 1rem; }
    .container { max-width: 1000px; margin: auto; background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 2rem; }
    .btn-tab { padding: 0.75rem 1.5rem; border: 1px solid var(--primary); background: white; color: var(--primary); border-radius: 8px; cursor: pointer; font-weight: bold; }
    .btn-tab.active { background: var(--primary); color: white; }
    .section-content { display: none; }
    .section-content.active { display: block; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 10px; border: 1px solid #e2e8f0; text-align: center; font-size: 0.9rem; }
    th { background: #f1f5f9; }
  </style>
</head>
<body>

<div class="container">
  <div class="nav-tabs">
    <button id="btnG" class="btn-tab active" onclick="tab('general', 'btnG')">Información General</button>
    <button id="btnA" class="btn-tab" onclick="tab('area', 'btnA')">Información por Área</button>
  </div>

  <div id="general" class="section-content active">
    <h2>Resumen Nacional</h2>
    <div id="stats">Cargando...</div>
  </div>

  <div id="area" class="section-content">
    <select id="selArea" onchange="render()"><option value="">Seleccione Área...</option></select>
    <div id="tablaDiv"></div>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxg6vaqC8w8IsCjHHy9UX9TTyf2nJKhlA1J37nvQEJb6ERK4nSQM5pAO7o8bqBYUj-0SQ/exec";
  let db = [];

  // Función que ya tienes probada en tu sistema
  function mapearIconoEstado(valor) {
    var esVerdadero = (valor === true || valor === "true" || valor === "VERDADERO" || valor === "TRUE");
    return esVerdadero ? "✔️" : "❌";
  }

  fetch(API_URL).then(r => r.json()).then(data => {
    db = data;
    const areas = [...new Set(db.map(i => i.columnaA).filter(Boolean))].sort();
    const sel = document.getElementById('selArea');
    areas.forEach(a => sel.innerHTML += `<option value="${a}">${a}</option>`);
    
    const count = (col) => db.filter(i => mapearIconoEstado(i[col]) === "✔️").length;
    document.getElementById('stats').innerHTML = `
      <p><b>FB:</b> VI(${count('columnaL')}) PPD(${count('columnaN')}) VF(${count('columnaO')}) GN(${count('columnaQ')})</p>
      <p><b>PC:</b> VI(${count('columnaS')}) PPD(${count('columnaU')}) VF(${count('columnaV')}) AAA(${count('columnaX')})</p>
    `;
  });

  function tab(id, btn) {
    document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.btn-tab').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.getElementById(btn).classList.add('active');
  }

  function render() {
    const area = document.getElementById('selArea').value;
    const filtrados = db.filter(i => i.columnaA === area && i.nombre && i.nombre.trim() !== "");
    let html = `<table><tr><th>Nombre</th><th>Cargo</th><th>FB: VI</th><th>FB: PPD</th><th>FB: VF</th><th>FB: GN</th><th>PC: VI</th><th>PC: PPD</th><th>PC: VF</th><th>PC: AAA</th></tr>`;
    
    filtrados.forEach(p => {
      html += `<tr><td>${p.nombre}</td><td>${p.cargo}</td>
      <td>${mapearIconoEstado(p.columnaL)}</td><td>${mapearIconoEstado(p.columnaN)}</td><td>${mapearIconoEstado(p.columnaO)}</td><td>${mapearIconoEstado(p.columnaQ)}</td>
      <td>${mapearIconoEstado(p.columnaS)}</td><td>${mapearIconoEstado(p.columnaU)}</td><td>${mapearIconoEstado(p.columnaV)}</td><td>${mapearIconoEstado(p.columnaX)}</td></tr>`;
    });
    document.getElementById('tablaDiv').innerHTML = html + "</table>";
  }
</script>
</body>
</html>
