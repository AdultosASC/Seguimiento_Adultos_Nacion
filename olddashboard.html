<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dirección Nacional de Adultos</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root { --primary: #6366f1; --primary-hover: #4f46e5; --purple-dark: #4c1d95; --purple-light: #8b5cf6; --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --text-light: #64748b; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; }
    body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 2rem 1rem; display: flex; justify-content: center; min-height: 100vh; box-sizing: border-box; }
    .container { background-color: var(--card-bg); padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); width: 100%; max-width: 850px; box-sizing: border-box; }
    .header-institucional { color: var(--purple-dark); font-size: 1.25rem; font-weight: 700; text-align: center; margin-bottom: 1.5rem; border-bottom: 2px dashed var(--border); padding-bottom: 1rem; }
    .titulo-principal-a { color: var(--purple-dark); font-weight: bold; font-size: 1.8rem; margin-bottom: 1.5rem; border-bottom: 2px solid var(--border); padding-bottom: 0.5rem; }
    .seccion-reporte { background-color: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .seccion-reporte h2 { font-size: 1.2rem; color: var(--primary); margin-top: 0; margin-bottom: 1rem; font-weight: 700; }
    .grid-dos-columnas { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem; }
    .dato-bloque { display: flex; flex-direction: column; }
    .dato-mixto-linea { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid var(--border); gap: 1.5rem; }
    .mixto-izq { display: flex; align-items: center; gap: 0.85rem; }
    .dato-label { font-size: 0.8rem; font-weight: 600; color: var(--text-light); text-transform: uppercase; margin-bottom: 0.2rem; }
    .dato-valor { font-size: 1rem; font-weight: 500; color: var(--text); }
    .status-badge { font-size: 1.2rem; font-weight: bold; }
    .tabla-archivos { width: 100%; border-collapse: collapse; margin-top: 0.5rem; background: white; border-radius: 8px; border: 1px solid var(--border); }
    .tabla-archivos th, .tabla-archivos td { padding: 0.75rem 1rem; text-align: left; font-size: 0.9rem; border-bottom: 1px solid var(--border); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <div id="tituloColumnaA" class="titulo-principal-a"></div>
    <div id="contenidoReporte">
      <div class="seccion-reporte">
        <h2>Información General</h2>
        <div class="grid-dos-columnas">
          <div class="dato-bloque"><span class="dato-label">Nombre</span><span id="valNombre" class="dato-valor"></span></div>
          <div class="dato-bloque"><span class="dato-label">Líder</span><span id="valLider" class="dato-valor"></span></div>
          <div class="dato-bloque"><span class="dato-label">Comisión</span><span id="valComision" class="dato-valor"></span></div>
          <div class="dato-bloque"><span class="dato-label">Resolución</span><span id="valResolucion" class="dato-valor"></span></div>
        </div>
      </div>

      <div class="seccion-reporte">
        <h2>Desarrollo y Seguimiento</h2>
        <div class="grid-dos-columnas">
          <div class="dato-mixto-linea">
            <div class="mixto-izq"><span id="statusGN" class="status-badge"></span><span class="verificacion-titulo">GN</span></div>
            <div id="boxFechaGN" class="dato-bloque" style="text-align: right;"><span class="dato-label">Fecha</span><span id="valFechaGN" class="dato-valor"></span></div>
          </div>
          <div class="dato-mixto-linea">
            <div class="mixto-izq"><span id="statusPCPPD" class="status-badge"></span><span class="verificacion-titulo">PC: PPD</span></div>
            <div class="dato-bloque" style="text-align: right;"><span class="dato-label">Fecha Val. Inicial PC</span><span id="valFechaValInicialPC" class="dato-valor"></span></div>
          </div>
          <div id="boxAAA" class="dato-bloque" style="grid-column: 1 / -1; background: #f0fdf4; padding: 0.75rem; border-radius: 8px; border: 1px solid #bbf7d0;">
            <span class="dato-label" style="color: #166534;">AAA</span><span id="valAAA" class="dato-valor" style="font-weight: 600;"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Asumimos que 'usuarioSeleccionado' ya contiene los datos del JSON
    function cargarReporte(usuarioSeleccionado) {
      document.getElementById('tituloColumnaA').textContent = usuarioSeleccionado.columnaA;
      document.getElementById('valNombre').textContent = usuarioSeleccionado.nombre;
      document.getElementById('valLider').textContent = usuarioSeleccionado.lider;
      document.getElementById('valComision').textContent = usuarioSeleccionado.comision;
      document.getElementById('valResolucion').textContent = usuarioSeleccionado.resolucion;

      // Procesar GN
      mapearIconoEstado('statusGN', usuarioSeleccionado.GN);
      document.getElementById('valFechaGN').textContent = usuarioSeleccionado.fechaGN || "N/A";

      // Procesar PCPPD
      mapearIconoEstado('statusPCPPD', usuarioSeleccionado.PCPPD);
      document.getElementById('valFechaValInicialPC').textContent = usuarioSeleccionado.fechaValoracionInicialPC || "N/A";

      // Procesar AAA
      document.getElementById('valAAA').textContent = usuarioSeleccionado.AAA || "N/A";
    }

    function mapearIconoEstado(idElemento, valor) {
      var el = document.getElementById(idElemento);
      var esVerdadero = (valor === true || valor === "true" || valor === "VERDADERO" || valor === "1" || valor === "SI");
      if (el) {
        el.textContent = esVerdadero ? "✔️" : "❌";
        el.style.color = esVerdadero ? "var(--success)" : "var(--danger)";
      }
    }
  </script>
</body>
</html>
