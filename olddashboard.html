<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dirección Nacional de Adultos</title>
  <style>
    :root {
      --primary: #6366f1; --primary-hover: #4f46e5; --purple-dark: #4c1d95; --purple-light: #8b5cf6;
      --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --text-light: #64748b; --border: #e2e8f0;
      --success: #10b981; --danger: #ef4444;
    }
    body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 2rem 1rem; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
    .container { background-color: var(--card-bg); padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); width: 100%; max-width: 450px; box-sizing: border-box; }
    .container.wide { max-width: 850px; }
    .header-institucional { color: var(--purple-dark); font-size: 1.25rem; font-weight: 700; text-align: center; margin-bottom: 1.5rem; border-bottom: 2px dashed var(--border); padding-bottom: 1rem; }
    h1 { font-size: 1.4rem; font-weight: 700; margin: 0 0 1.5rem 0; text-align: center; }
    .form-group { margin-bottom: 1.5rem; }
    .label-filtro { display: block; font-size: 0.9rem; font-weight: 700; color: var(--purple-dark); margin-bottom: 0.6rem; }
    select { width: 100%; padding: 0.75rem 1rem; font-size: 1rem; background-color: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); outline: none; box-sizing: border-box; }
    button { width: 100%; padding: 0.75rem 1rem; font-size: 1rem; font-weight: 600; color: white; background-color: var(--primary); border: none; border-radius: 8px; cursor: pointer; margin-top: 1rem; }
    .hidden { display: none !important; }
    .titulo-principal-a { color: var(--purple-dark); font-weight: bold; font-size: 1.8rem; margin-bottom: 1.5rem; border-bottom: 2px solid var(--border); padding-bottom: 0.5rem; }
    .seccion-reporte { background-color: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .seccion-reporte h2 { font-size: 1.2rem; color: var(--primary); margin-top: 0; margin-bottom: 1rem; font-weight: 700; }
    .grid-dos-columnas { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem; }
    .dato-bloque { display: flex; flex-direction: column; }
    .dato-label { font-size: 0.8rem; font-weight: 600; color: var(--text-light); text-transform: uppercase; margin-bottom: 0.2rem; }
    .dato-valor { font-size: 1rem; font-weight: 500; color: var(--text); }
    .chulo { color: var(--success); font-weight: bold; }
    .equis { color: var(--danger); font-weight: bold; }
    .btn-back { background-color: transparent; color: var(--text-light); border: 1px solid var(--border); margin-top: 1rem; width: auto; padding: 0.5rem 1rem; }
  </style>
</head>
<body>

  <div id="paginaFiltros" class="container">
    <div class="header-institucional">Dirección Nacional de <br>Adultos en el Movimiento</div>
    <h1>Consulta/Registro de Información</h1>
    <div class="form-group">
      <label for="selectA" class="label-filtro">Seleccione Área Estratégica</label>
      <select id="selectA" onchange="cambioArea()"><option value="">Conectando con la base de datos...</option></select>
    </div>
    <div id="grupoC" class="form-group hidden">
      <label for="selectC" class="label-filtro">Seleccione Nombre</label>
      <select id="selectC" onchange="activarBotonConsultar()"><option value="">-- Seleccione un nombre --</option></select>
    </div>
    <button id="btnConsultar" disabled onclick="irAPaginaReporte()">Consultar</button>
  </div>

  <div id="paginaReporte" class="container wide hidden">
    <div id="tituloColumnaA" class="titulo-principal-a"></div>
    <div id="contenidoReporte" class="hidden">
      <div class="seccion-reporte">
        <h2>Información General</h2>
        <div class="grid-dos-columnas">
          <div class="dato-bloque"><span class="dato-label">Nombre</span><span id="valNombre" class="dato-valor"></span></div>
          <div class="dato-bloque"><span class="dato-label">Cargo</span><span id="valCargo" class="dato-valor"></span></div>
          <div id="boxGestor" class="dato-bloque" style="grid-column: 1 / -1;"><span class="dato-label">Gestor Nacional (GN)</span><span id="valGestor" class="dato-valor"></span></div>
        </div>
      </div>
      <div class="seccion-reporte">
        <h2>Desarrollo Personal</h2>
        <div class="grid-dos-columnas">
          <div class="dato-bloque"><span class="dato-label">PF: PPD</span><span id="valPPD" class="dato-valor"></span></div>
          <div class="dato-bloque"><span class="dato-label">AAA</span><span id="valAAA" class="dato-valor"></span></div>
        </div>
      </div>
    </div>
    <button class="btn-back" onclick="volverYRefrescarConsulta()">Volver a consultar</button>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxg6vaqC8w8IsCjHHy9UX9TTyf2nJKhlA1J37nvQEJb6ERK4nSQM5pAO7o8bqBYUj-0SQ/exec"; 
    let baseDatosCompleta = [];

    window.onload = function() { fetch(API_URL).then(r => r.json()).then(data => { baseDatosCompleta = data; inicializarDesplegableA(); }); };

    function procesarDato(valor) {
      if (valor === null || valor === undefined || valor === "" || valor === "N/A") return '<span class="equis">❌</span>';
      var v = String(valor).trim().toUpperCase();
      return (v === "TRUE" || v === "VERDADERO" || v === "1" || v === "V" || v === "SI") ? '<span class="chulo">✔️</span>' : '<span class="equis">❌</span>';
    }

    function inicializarDesplegableA() {
      var select = document.getElementById('selectA');
      let areas = [...new Set(baseDatosCompleta.map(item => item.columnaA))].filter(Boolean).sort();
      select.innerHTML = '<option value="">-- Seleccione un Área --</option>';
      areas.forEach(area => { let el = document.createElement('option'); el.value = area; el.textContent = area; select.appendChild(el); });
    }

    function cambioArea() {
      var valorA = document.getElementById('selectA').value;
      var grupoC = document.getElementById('grupoC');
      var selectC = document.getElementById('selectC');
      if (!valorA) { grupoC.classList.add('hidden'); return; }
      let nombres = baseDatosCompleta.filter(item => item.columnaA === valorA).map(item => item.nombre);
      selectC.innerHTML = '<option value="">-- Seleccione un nombre --</option>';
      nombres.forEach(nom => { let el = document.createElement('option'); el.value = nom; el.textContent = nom; selectC.appendChild(el); });
      grupoC.classList.remove('hidden');
    }

    function activarBotonConsultar() { document.getElementById('btnConsultar').disabled = (document.getElementById('selectC').value === ""); }

    function irAPaginaReporte() {
      let u = baseDatosCompleta.find(item => item.columnaA === document.getElementById('selectA').value && item.nombre === document.getElementById('selectC').value);
      document.getElementById('paginaFiltros').classList.add('hidden');
      document.getElementById('paginaReporte').classList.remove('hidden');
      
      document.getElementById('valNombre').textContent = u.nombre;
      document.getElementById('valCargo').textContent = u.cargo;
      document.getElementById('valGestor').innerHTML = procesarDato(u.columnaQ);
      document.getElementById('valPPD').innerHTML = procesarDato(u.columnaU);
      document.getElementById('valAAA').innerHTML = procesarDato(u.columnaX);
      
      document.getElementById('contenidoReporte').classList.remove('hidden');
    }

    function volverYRefrescarConsulta() { location.reload(); }
  </script>
</body>
</html>
